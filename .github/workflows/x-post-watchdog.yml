name: NAGOYA BITES — X 自動投稿の見張り

# SNS-005（計画書 docs/x-auto-posting-plan-2026-10.md の 7 章）
#   ジャーナルが公開されたのに X への投稿が無い・鍵の失効・残高切れ・文面の検査落ちを、
#   原因と直し方つきの GitHub Issue（＝オーナーにメール）で知らせ、投稿が確認できたら自動で閉じる。
#   判定は scripts/check_x_post_health.js（mode が live でなければ何もしない）。
#   続いている間は Issue の本文を書き換えるだけで、コメントもジョブの失敗もしない（オオカミ少年化させない）。
#   ジャーナルが休みの日は鳴らさない（それは journal-watchdog.yml の役目）。

on:
  schedule:
    - cron: '0 12 * * *'  # 21:00 JST 意図
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 判定
        run: |
          set +e
          node scripts/check_x_post_health.js --json > /tmp/x-post-health.json
          set -e
          node -e "const r=require('/tmp/x-post-health.json');console.log(r.ok?'OK ('+r.status+')':r.issue_body)"

      - name: Issue を起票・更新・クローズ
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/x-post-health.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'x-post-watchdog';
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 20 });
            const existing = issues.find(i => i.title.startsWith('🔴 X 自動投稿'));
            if (r.ok) {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `✅ 復旧を確認しました（JST ${r.today}・${r.status}）。自動でクローズします。` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              } else {
                core.info(`問題なし（${r.status}）`);
              }
              return;
            }
            const kinds = [...new Set(r.problems.map(p => p.error_class || p.kind))].join('・');
            const title = `🔴 X 自動投稿が止まっています（${kinds}・最新 ${r.problems[0].date}）`;
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body: r.issue_body });
              core.info(`Issue #${existing.number} の本文を更新しました`);
            } else {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (_) {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'X 自動投稿の見張り（x-post-watchdog.yml）' });
              }
              const { data: created } = await github.rest.issues.create({ owner, repo, title, body: r.issue_body, labels: [label] });
              core.warning(`Issue #${created.number} を起票しました`);
            }
