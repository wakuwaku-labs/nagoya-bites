name: editorReason batch

# ISSUE-045 自動化: 上位候補 50 店を Gemini API（無料枠）の Google検索グラウンディングで
# 調査 → 「引用ベースの editorReason draft」を生成 → docs/editorreason-drafts.md を
# 更新してコミット。
#
# 人手レビュー後、scripts/approve_editorreason_drafts.js で editor_picks.json に反映。
#
# 必要 Secrets:
#   GEMINI_API_KEY — Gemini API キー（scripts/daily_store_discovery.js と共用可・無料枠）
# 未設定の場合は build_editorreason_drafts.js が exit 0 でスキップ（CI 失敗扱いにしない）。
#
# ISSUE-098 の変遷（2026-08-19）:
#   1. 元は ANTHROPIC_API_KEY 前提 → 13週連続で未設定のままサイレント無稼働だったと判明
#   2. 新規Anthropicアカウント作成を避けるため GEMINI_API_KEY + Google CSE に切替
#   3. 実際に稼働させたところ Google Custom Search JSON API が「新規プロジェクトには
#      提供終了済み」（developers.google.com/custom-search/v1/overview に
#      "closed to new customers" と明記）と判明。CSE を廃止し、Gemini の Google検索
#      グラウンディング機能（daily-store-add.yml と同じ仕組み・新規サインアップ不要）に
#      置き換えた（scripts/lib/gemini_grounded_extractor.js）。GOOGLE_CSE_KEY/CX は不要
#
# セットアップ手順: docs/editorreason-automation-setup.md

on:
  schedule:
    # 毎週月曜 18:00 UTC（JST 火 3:00）
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      top:
        description: '対象件数（上位 N 候補）'
        required: false
        default: '50'

permissions:
  contents: write

concurrency:
  group: editorreason-batch
  cancel-in-progress: false

jobs:
  build_drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (Gemini SDK)
        run: npm install --no-save @google/generative-ai

      - name: Build editorReason drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TOP="${{ github.event.inputs.top || '50' }}"
          node scripts/build_editorreason_drafts.js --top "$TOP"

      - name: Summary
        if: always()
        run: |
          if [ -f docs/editorreason-drafts.md ]; then
            echo "=== drafts file summary ==="
            head -20 docs/editorreason-drafts.md
          else
            echo "::warning::docs/editorreason-drafts.md が無い — シークレット未設定の可能性。docs/editorreason-automation-setup.md 参照"
          fi

      - name: Commit drafts cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/editorreason-drafts.md data/editorreason_drafts/ || true
          if git diff --cached --quiet; then
            echo "変更なし - コミットスキップ"
          else
            git commit -m "chore(editorreason): weekly batch drafts $(date +%Y-%m-%d) [skip actions]"
            git pull --rebase origin main || true
            git push || (sleep 5 && git pull --rebase origin main && git push)
            echo "::notice::editorReason drafts 更新済み。docs/editorreason-drafts.md をレビューして [approved] を付け、approve_editorreason_drafts.js を実行してください。"
          fi
