name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日午前3時(JST)に自動実行してスプレッドシートの最新データを反映
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy
  # このジョブは実行中に GA4/GSC/Places写真等を取得して main へ直接 commit & push する
  # （デプロイ専用ではなくデータパイプラインを兼ねる）。cancel-in-progress:true だと、
  # 短時間に複数PRがマージされた際に実行中のジョブが中断され、その回の取得結果が
  # 一切保存されないまま捨てられる（2026-08-18実測: 09:57-10:08の間に3連続でこれが発生し、
  # 写真取得の検証結果が2回とも失われた）。各実行は開始時に main の最新HEADを
  # checkout するため、キューイングしても古い内容をデプロイしてしまう心配は無い。
  # false にすると: 実行中のジョブは中断されず完走し、待機中に来た複数pushは
  # 最新1件だけがキューされる（GitHub Actions の標準動作）＝ロスト無く、かつ
  # 無限にジョブが積み上がることもない。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (for GA4 SDK)
        run: npm install --no-audit --no-fund --silent

      - name: Fetch GA4 global view counts → data/view_counts.json
        run: node scripts/fetch_ga4_views.js
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        continue-on-error: true

      - name: Fetch GSC search performance → data/gsc_metrics.json
        run: node scripts/fetch_gsc_metrics.js
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        continue-on-error: true

      - name: GSC 改善機会を抽出 → data/gsc_opportunities.json（ISSUE-072 改善ループ）
        run: node scripts/gsc_opportunities.js
        continue-on-error: true

      - name: 検索・AI流入をエンジン別に集計 → data/search_channel_metrics.json（SEO-039）
        # GSC は Google しか映さないが、実測では Bing 48.5% / 生成AI 33.3% / Google 13.8%（検索経由363セッション）。
        # 流入の大半が既存ループの観測外にあるため、エンジン単位の内訳をここで固定化する。
        run: node scripts/search_channel_metrics.js
        continue-on-error: true

      - name: 手動キュレーション店の実写写真を Google Places API で取得＋失効URLの自動修復
        # ① 写真URLが空 or SVGプレースホルダーの店 → Google Places で店名+住所マッチングして実写取得
        # ② 既に写真URLがある店も **毎回配信の生死を検査**（ISSUE-074）。Places の
        #    lh3.googleusercontent.com URL は写真ごとに 403 化するため、失効分だけ再取得して自動修復する。
        #    保存済み place_id があれば findplacefromtext を省いて details 直引き（API呼び出し半減）。
        #    再取得できない失効URLはクリアし、JSON-LD image / og:image が 403 を指し続けるのを防ぐ
        #    （API 障害時は誤消去しないよう応答有無で判定）。
        # name-mismatch / out-of-area / not-food の三重ゲートは place_id 経由でも必ず再検証（ISSUE-060）。
        run: node scripts/fetch_manual_store_photos.js
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        continue-on-error: true

      - name: Instagram 埋め込みの証跡を補充（削除済み投稿の検知も兼ねる）
        # 新しく増えた埋め込みの本文を回収し、削除された投稿（埋め込みが「リンクが壊れています」
        # と表示される状態）を検出する。1回あたり上限を設けて実行時間を抑える。
        run: node scripts/fetch_ig_post_evidence.js --limit 120 --delay 700
        continue-on-error: true

      - name: Instagram 埋め込みを「店の雰囲気がわかる投稿」に選び直す（ISSUE-092）
        # 基準を通らない投稿しか無い店について、そのアカウントの最近の投稿を新しい順に見て
        # 最初に基準を通った1件へ差し替える。全部通らなければ埋め込みなしのままにする。
        # ログイン不要の公開エンドポイントだけを使うため、Instagram の認証が切れていても回る
        # （認証切れで選定が止まり続けるのを防ぐ）。1回あたり上限を設けて実行時間を抑える。
        run: node scripts/select_ig_posts.js --limit 80 --delay 1200
        continue-on-error: true

      - name: Build (embed store data & update sitemap)
        run: node build.js
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}

      - name: 単体・回帰テスト（npm test / ISSUE-090 acceptance 5）
        # これまで npm test はどの workflow からも実行されておらず、テストは書かれているのに
        # 一度も自動実行されていなかった（ISSUE-089 の回帰6件を含む）。Actions は success のまま
        # ローカルでだけ赤い、という乖離が起きていたため CI に載せる。ISSUE-084 の教訓と同型。
        #
        # **意図的にブロッキング**（continue-on-error を付けない）。
        # 付けた瞬間に「鳴らない報知器」に戻り、載せた意味が消えるため。
        # ビルド生成物を検証したいので build.js の後に置く。
        run: npm test

      - name: 架空店監査（特集の掲載店 vs LOCAL_STORES 照合・退行検知）
        # 実在データに無い掲載店を検出して警告（非ブロッキング）。CLAUDE.md「架空店ブロック」整合。
        run: node scripts/audit_feature_stores.js
        continue-on-error: true

      - name: 特集の見出し階層監査（SEO-060 退行検知）
        # 店名=h3・セクション見出し=h2 が維持されているかを検査。
        # 実測で「検索1ページ目に届いた特集だけが見出し階層を持つ」ことが確認されており
        # （h3 を持つのは15本中1本のみ・本文量や被リンク数では順位差を説明できない）、
        # 生成器が <div>/<p> に戻ると全特集の主題構造が機械可読でなくなるため CI で固定する。
        run: node scripts/migrate_feature_headings.js --check

      - name: features/*.html スキーマ整合性監査（ISSUE-059 再発防止）
        # title/h1 と Article/ItemList/BreadcrumbList/FAQPage の語彙整合性を検査。
        # コピペテンプレ事故（ラーメンFAQが焼き鳥ページに混入する等）を CI で都度検出。
        # 非ブロッキング（短文 2-gram の偽陽性が混じるため警告のみ）。
        run: node scripts/audit_feature_schema_alignment.js
        continue-on-error: true

      - name: isNagoyaStore 品質フィルタ単体テスト（ISSUE-057 再発防止）
        # ACCESS_HARD_NEGATIVE の substring 偽陽性で名古屋確定店が暗黙除外される
        # silent-bug を防ぐ 15 ケース単体テスト。失敗で CI を落とす。
        run: node scripts/audit_isnagoya_filter.js

      - name: 営業実体監査（閉店/掲載保留の掲載を検知・DATA-LIVENESS 再発防止）
        # 2026-06-11「餃子歩兵 名古屋泉店（2023-09-30閉店）」混入を受けて新設。
        # data/closed_stores.json（一次情報で閉店確認）＋ Places business_status
        # ＋ 自社テキストの閉店ワードで「掲載してはならない店」を検出。
        # build.js が同じ closed_stores.json で除外するため通常はゼロ。
        # CLOSED_PERMANENTLY/閉店確定が混入したら exit 1 でデプロイをブロックする（制約7・信頼担保）。
        run: node scripts/audit_store_liveness.js

      - name: manual_stores.json リンク到達性監査（ISSUE-061 観測）
        # 食べログ直リンク / ホットペッパーID / 住所のいずれも持たない
        # 「ユーザーが詳細を確認できない店」の件数を可視化。
        # 退場コード非ゼロでも CI は止めない（既存 28 件のため）。
        run: node scripts/audit_manual_stores_links.js
        continue-on-error: true

      - name: agent-backlog.md 重複ID監査（並列起票の採番衝突を検知・ORG-004）
        # 並列エージェント/複数 workflow が同じ番号で起票する事故を検知（ISSUE-048/059 で実発生）。
        # 既知4件(ISSUE-007/018/048/STR-001)は KNOWN_DUPLICATES でWL。新規重複だけ exit 1。
        # 初回は continue-on-error で安全に開始 → WL整合を確認後にこの行を外して厳格化する。
        run: node scripts/audit_backlog_ids.js
        continue-on-error: true

      - name: 特集鮮度ガード（カレンダーの穴・壊れ参照を検出）
        # data/featured.json の monthlyFeature が12ヶ月を実在ページで埋めているか、
        # showcase/items の参照先が実在し画像取得可能かを検査（鮮度の穴ゼロを担保）。
        # 非ブロッキング（警告のみ）。ローカルでは node scripts/build_featured.js --check。
        run: node scripts/build_featured.js --check
        continue-on-error: true

      - name: 特集の鮮度自動更新（今月の旬リード＋週替わりショーケース＋期間切れ除外）
        # data/featured.json を JST 当日で評価し index.html / features/index.html の特集ブロックを再生成。
        # monthlyFeature(毎月の旬) と season.recurring(毎年判定) により常に最新感を保つ。冪等。
        run: node scripts/build_featured.js

      - name: 特集の掲載店を月次ローテーション更新（毎月1〜3日のみ・その月の需要に合う店へ入替）
        # data/feature_rosters.json のバランス型スコア＋ハードゲートで、シーン特集の
        # 掲載店を「実力上位の固定コア＋今月の新顔」に再構成する（ハイブリッド方式）。
        # 掲載を月内で安定させるため月初(1〜3日 JST)のみ実行。全掲載店は実在店のみ（架空店ブロック）。
        # 枠割れ(--check)はビルドを止めない（データ変動で一時的に起こりうるため警告扱い）。
        run: |
          D=$(TZ=Asia/Tokyo date +%d)
          if [ "$D" = "01" ] || [ "$D" = "02" ] || [ "$D" = "03" ]; then
            node scripts/refresh_feature_rosters.js
          else
            echo "月初(1〜3日 JST)以外のため特集ロスター更新はスキップ（掲載を月内で安定させる）"
          fi
        continue-on-error: true

      - name: 特集上部CTAの自動付与（SEO-045・実データ追従型）
        # data/view_counts.json の流入実績でターゲット特集を決め、各記事の ItemList 先頭から
        # 3店を抽出して冒頭に CTA ブロックを追加する。build_featured.js / refresh_feature_rosters.js
        # のあとに実行することで最新の掲載店状態を前提にした CTA が付与される。冪等。
        run: node scripts/add_feature_top_cta.js
        continue-on-error: true

      - name: 店舗写真を原寸マスターへ昇格（画質改善・実測ベース・冪等）
        # Hot Pepper の _480.jpg は 480px しかなく、モーダル(約2000px相当)で 4倍に
        # 引き伸ばされてボケていた。サフィックスなしURLが投稿時の原寸(720〜1280px)を返すため、
        # 1件ずつ HTTP で実測し「実測幅が現在より大きい店だけ」を昇格する。
        # 推測では昇格しない（CLAUDE.md 制約10: 検証できる事実だけで判定）。
        # 新規追加店（weekly の fetch_hotpepper_popular.js 等）も実行時に自動で実測・追従する。
        # build.js の後・gen-store-pages.js の前に置くことで stores/*.html にも反映される。
        run: node scripts/promote_store_photos.js
        continue-on-error: true

      - name: 個別店舗ページ再生成（manual_stores 追加分を stores/*.html に反映）
        # build.js が data/stores.json を更新した後、その canonical カタログを source に
        # 個別店舗ページを生成する。これがないと manual_stores.json に追加した店が
        # フロント検索ヒット時の詳細ページから 404 になる（ISSUE-058 の再発防止）。
        run: node gen-store-pages.js

      - name: 店舗写真カバレッジ監査（画質退行の検知・実写ゼロ店の可視化）
        # build.js normalizePhotoUrl() が HotPepper 縮小サムネ(_238等)を _480 へ昇格し、
        # さらに promote_store_photos.js が実測で原寸へ昇格するため、縮小サムネ残留は
        # 通常ゼロ。--strict で残留＝退行を検知する。
        # 実写ゼロ店（Places三重検証ゲート未通過）のリストもログに出して編集部が追える状態を保つ。
        # 初回は continue-on-error で安全に開始（既存監査と同じ運用）。
        run: node scripts/audit_photo_coverage.js --strict
        continue-on-error: true

      - name: 店舗写真の採用基準を監査（客が投稿したスマホ写真の混入検知）
        # Google Places の写真には「オーナーが上げた宣材」と「客が上げたスマホ写真」が
        # 混在し、photos[0] が客の写真であることが実測で半分あった（2026-08-16・132件中66件）。
        # 取得側（fetch_manual_store_photos.js）にゲートを入れても、別経路や巻き戻しから
        # 基準外の写真が入り得るため、canonical を毎回検査して退行を止める。
        # 判定根拠は写真クレジット（authorAttributions）＝後から第三者が検算できる事実のみ
        # （CLAUDE.md 制約10）。基準は data/photo_policy.json が唯一の情報源。
        # 既存データの積み残し（クレジット未記録の既存Places写真）を解消するまでは警告のみ。
        run: node scripts/audit_photo_policy.js --check
        continue-on-error: true

      - name: Instagram 埋め込みの内容関連性を監査（ISSUE-092）
        # 店舗カードに出す IG 埋め込みが「その店の料理・内装・外観がわかる投稿」かを検査する。
        # 所有者検証（audit_reel_ownership.js）が見るのは「その店の投稿か」で、
        # 「中身が店の紹介になっているか」は見ていなかったため、公式アカ本人が上げた
        # 求人・休業案内・御礼投稿（例: 頂き物の苺のパック写真）が焼肉店のカードに出ていた。
        # 判定根拠は公開 embed のキャプション本文＝誰でも同じURLを開いて検算できる事実のみ
        # （CLAUDE.md 制約10）。基準は data/ig_post_policy.json が唯一の情報源。
        run: node scripts/audit_ig_post_relevance.js --check
        continue-on-error: true

      - name: Instagram ボタンのリンク先が異ブランド共有でないかを監査（ISSUE-090）
        # 1つのアカウントが複数ブランドにまたがって登録されていると、「Instagram」ボタンを
        # 押すと別の店の IG に飛ぶ誤リンクになる。判定根拠は instagram_resolved.json の
        # アカウント名と店名から求めるブランド判定のみ＝第三者が検算できる事実だけ（制約10）。
        # 違反店は instagram を空にして instagramSearchUrl() の店名検索フォールバックへ誘導する。
        run: node scripts/audit_instagram_links.js --check

      - name: ジャーナルのヒーロー写真が記事と対応しているかを監査（2026-08-17 の事故）
        # 2026-08-17、記事の主役2店が新店で写真を持たなかったため、記事に一行触れただけの
        # 別店の販促バナー（ドリンク94円）が記事の顔になって公開された。当時の validator は
        # 「汎用ストック写真でないこと」しか見ておらず、「その記事の店の写真であること」は
        # 誰も検証していなかった。発覚はオーナーがサイトを見るまで遅れた。
        #
        # → 検知は人が見に行かなくても届く場所で回す（CLAUDE.md 無人自動化の監視の原則1・3）。
        #   判定は検証できる事実だけ（HotPepper画像URL→所有店の逆引き / 記事に刻んだ
        #   data-hero-store / 記事slugと図のファイル名の対応）で行い、自己申告値を見ない（制約10）。
        # 基準は data/journal_photo_policy.json が唯一の情報源。
        run: node scripts/audit_journal_photos.js --check

      - name: KPI 日次スナップショットを時系列に追記（ORG-005・効果測定の Check）
        # data/site_metrics.json（上の GA4 fetch で更新済み）を metrics_history.json に1日1行 append。
        # 毎日上書きでなく追記することで、施策デプロイ前後の KPI 比較を可能にする（PDCA の Check）。
        run: node scripts/track_metrics.js --snapshot
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ISSUE-058: data/stores.json (canonical full catalog) と stores/*.html (個別店舗ページ) も
          # commit 対象に追加。これらが入っていないと manual_stores 追加分が
          # フロント検索 (fetchFullCatalog) や個別ページ URL から到達不能になる。
          # ISSUE-076: data/pending_stores.json も commit 対象。ここが漏れていると
          # Places で取得した pending 店の写真が毎回捨てられ、無駄な API 再取得が続く。
          # data/crosscheck.json: モーダル「内訳を見る」の遅延ロード元。ここが漏れていると
          # CI で毎ビルド生成されても捨てられ、フロントが古い内訳（一部店舗のみ）を出し続ける。
          git add index.html features/index.html sitemap.xml data/stores.json data/ig_post_evidence.json data/instagram_posts.json data/manual_stores.json data/pending_stores.json data/view_counts.json data/site_metrics.json data/gsc_metrics.json data/gsc_opportunities.json data/search_channel_metrics.json data/cross_check_flags.json data/crosscheck.json data/metrics_history.json data/effect_ledger.json data/feature_rosters.json
          # 特集本体(features/*.html)も commit 対象。月次ロスター更新の掲載店入替を反映する。
          git add features/ || true
          git add stores/ || true
          git diff --cached --quiet || git commit -m "chore: auto-update store data [skip actions]"
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push)

      - name: OGP画像の配信可否を監査（SNSサムネイルが出ない状態の検知）
        # X / Facebook / LINE の OGP クローラは SVG をレンダリングせず、相対パスも解決しない。
        # どちらか一方でも崩れると「SNSに貼ってもサムネイルが出ない」状態になり、
        # 日次ジャーナルの主要導線（SNS手動投稿）の CTR を丸ごと落とす。
        # サイトの見た目には異常が出ず、オーナーが実際に共有するまで誰も気づかないため
        # サーバ側で毎日検査する（CLAUDE.md 無人自動化の監視原則3: 気づけるはず＝検知ではない）。
        # 判定は検証できる事実のみ（PNGのIHDR実寸・URLが絶対か・PNGの実在）＝制約10。
        #
        # 位置に意味がある: commit & push の「後」に置くこと。
        # 前に置くと OGP の不備で店舗データの日次更新まで止まり、被害が逆転する。
        # ここで落ちれば Actions の失敗通知がオーナーのメールに届く（out-of-band 通知）。
        #
        # 修復: node scripts/render_og_figures.js && node scripts/normalize_og_images.js
        # （PNG生成には Chrome/Chromium が要るためローカルで実行して push する）
        run: |
          node scripts/render_og_figures.js --check
          node scripts/normalize_og_images.js --check
