name: NAGOYA BITES — SEO週次トリアージ 生存監視

# なぜこのワークフローが必要か（SEO-103・2026-09-20）:
#   週次レポートメール（件名「📊 NAGOYA BITES 週次レポート」）は GAS が Gmail 送信するが、
#   Gmail が誤って TRASH へ移動させており、/seo-triage-weekly の Gmail 検索クエリ
#   （newer_than:9d・TRASH を探さない）が 0件を返して静かに正常終了する。
#   週次処理が止まっても「採用/却下件数が減った」以外に外から気づく方法がなかった。
#
#   この監視は data/seo_advice_log.json の source="line-weekly" エントリの鮮度だけを見る。
#   採用・却下の件数は見ない（0件は正常。鳴らすのは「処理自体が止まったこと」だけ）。
#
#   動いていないルーチンはエントリを追記できないため、エントリ日付は偽装不能な事実
#   （CLAUDE.md 制約10）。
#
#   ISSUE-084 の教訓（警報を防音室で鳴らすな）をそのまま適用:
#     1. 監視は監視対象と別の場所で回す  → ローカル/クラウドルーチンではなく GitHub Actions
#     2. 通知は out-of-band に出す        → Issue 起票（GitHub が既定でオーナーにメールする）
#     3. 「気づけるはず」を検知と数えない → 人がログを見に行かなくても届く

on:
  schedule:
    # 07:00 UTC = 16:00 JST。週次処理の実行タイミングに依存しないよう、
    # 許容欠測日数（既定14日）側で余裕を持たせている。
    - cron: '0 7 * * *'
  workflow_dispatch: # 手動確認・復旧後の即時クローズ用

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生存確認
        id: check
        run: |
          set +e
          node scripts/check_seo_triage_weekly_health.js --json > /tmp/seo-weekly-health.json
          set -e
          echo "----- 判定結果 -----"
          node scripts/check_seo_triage_weekly_health.js || true

      - name: 異常なら Issue を起票/更新、復旧していればクローズ
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('/tmp/seo-weekly-health.json', 'utf8'));
            const label = 'seo-triage-weekly-watchdog';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const existing = issues.find(i => i.title.startsWith('🔴 SEO週次トリアージが処理されていません'));

            // ---- 復旧している場合: 開いている Issue を閉じる ----
            if (r.ok) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `✅ 復旧を確認しました（JST ${r.today_jst}）。最後の週次処理: ${r.last_weekly.date}（${r.silence_days}日前）。自動クローズします。`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                });
                core.info(`Issue #${existing.number} を復旧クローズしました。`);
              } else {
                core.info('健全。Issue の起票は不要です。');
              }
              return;
            }

            // ---- 異常あり: 起票 or 更新 ----
            const kinds = r.problems.map(p => p.kind).join(', ');
            const title = `🔴 SEO週次トリアージが処理されていません（${kinds}）`;

            const lines = [];
            lines.push('SEO週次トリアージの **生存確認に失敗**しました（JST ' + r.today_jst + ' 時点）。');
            lines.push('');
            lines.push('> 週次トリアージが止まると、Google Analytics の週次トレンド・前週比の悪化が');
            lines.push('> 気づかれないまま施策化されず、改善ループが断絶します。');
            lines.push('> （参考: 2026-09 に TRASH 誤振り分けで週次メールが取得できない状態が続いた・SEO-103）');
            lines.push('');
            lines.push('## 検出内容');
            for (const p of r.problems) lines.push(`- **${p.kind}** — ${p.detail}`);
            if (r.warnings.length) {
              lines.push('');
              lines.push('## 警告（それ自体は異常ではない）');
              for (const w of r.warnings) lines.push(`- ${w}`);
            }
            lines.push('');
            lines.push('## 最後の週次処理');
            if (r.last_weekly) {
              lines.push(`- 対象日: \`${r.last_weekly.date}\`（${r.silence_days}日前 / 許容 ${r.max_silence_days}日）`);
              lines.push(`- verdict: \`${r.last_weekly.verdict}\` / id: ${r.last_weekly.id || '—'}`);
              lines.push(`- 累計 line-weekly エントリ数: ${r.total_weekly_entries}`);
            } else {
              lines.push('- `data/seo_advice_log.json` に line-weekly エントリが一件もありません。');
            }
            lines.push('');
            lines.push('## 対処');
            lines.push('1. **`stale_weekly` の場合（最有力: Gmail TRASH 誤振り分け）** — SEO-103 参照。');
            lines.push('   - Gmail フィルタを確認し、「📊 NAGOYA BITES 週次レポート」が TRASH へ移動していないか確認する。');
            lines.push('   - 週次メールを INBOX に移動し、`/seo-triage-weekly` を手動で実行する。');
            lines.push('   - TRASH でも検出できるよう Gmail 検索クエリに `in:anywhere` を追加する（`docs/seo-triage-weekly-runbook.md`）。');
            lines.push('2. **ルーチン未登録の場合** — claude.ai のスケジュールで週次トリアージが登録されているか確認する。');
            lines.push('3. 復旧後は手動で1回実行し、`data/seo_advice_log.json` に line-weekly エントリが追加されることを確認する:');
            lines.push('   ```bash');
            lines.push('   node scripts/check_seo_triage_weekly_health.js');
            lines.push('   ```');
            lines.push('4. 停止期間中に送られてきていた週次レポートは `in:anywhere` を使って遡って処理する。');
            lines.push('   台帳突合（fingerprint 重複チェック）があるため二重起票にはなりません。');
            lines.push('');
            lines.push('---');
            lines.push('この Issue は生存確認が通ると自動でクローズされます（seo-triage-weekly-watchdog.yml）。');
            const body = lines.join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body,
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `再検出（JST ${r.today_jst}）。現在の問題: ${kinds}`,
              });
              core.setFailed(`SEO週次トリアージの異常が継続しています: ${kinds}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title, body, labels: [label],
              });
              core.setFailed(`SEO週次トリアージの異常を検出し Issue #${created.number} を起票しました: ${kinds}`);
            }
