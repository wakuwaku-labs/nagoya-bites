name: Monthly Google Places fetch

# ISSUE-048 Step 2: Google Places API でレビュー件数・営業ステータスを取得し
# data/places_resolved.json にキャッシュ。TRUST SCORE（crossCheckScore）の
# S1（★ vs 件数比率）/ S2（件数絶対値）シグナルを正規化するために使用する。
#
# TRUST SCORE 精度向上（サクラチェック強化）: 従来はキャッシュ済み店を毎月スキップして
# いたため places_history.json の snapshots が全店 1 個のまま増えず、S7（時系列健全性・
# openingBurstPattern 検出）が実質死んでいた。第2ステップとして --refresh を追加実行し、
# 既存店の snapshot を staleness ベース・予算制御付きで定期的に積み増す。
#
# コスト（2026-08 実測 5,119 店ベース・階層化運用）:
#   Step1 新規店解決: Find Place ($17/1000) — 新規追加分のみで少額
#   Step2 --refresh:  Place Details のみ ($22/1000 = Basic+Atmosphere)
#                      既定予算 PLACES_DETAILS_BUDGET=1700件/月 ≈ $37/月
#                      優先店（フラグ付き・露出中）は毎月、残りは古い順で約3ヶ月周期
#   合算で無料クレジット $200/月 内（写真取得等の他ジョブと合わせて余裕を確認すること）
#
# 事前準備（リポジトリオーナー側で必要）:
#   1. Google Cloud Platform でプロジェクト作成 → Places API 有効化
#   2. API キー発行（HTTP リファラ制限なしで作成）
#   3. GitHub Secrets に GOOGLE_PLACES_API_KEY を設定
#   4. Google Cloud Console で予算アラート $50 設定推奨
#   5. （任意）repo variables に PLACES_DETAILS_BUDGET を設定して --refresh の予算を調整
#
# 注: GOOGLE_PLACES_API_KEY が未設定の場合、fetch_places.js は exit 0 で
#     スキップするため、ワークフローは失敗扱いにならない。

on:
  schedule:
    # 毎月 1 日 18:00 UTC（JST 翌 2 日 3:00）に実行
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-places
  cancel-in-progress: false

jobs:
  fetch_places:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step1 — 新規店を解決 → data/places_resolved.json
        run: node scripts/fetch_places.js
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Step2 — 既存店を staleness ベースで再取得（S7 時系列蓄積の本丸）
        run: node scripts/fetch_places.js --refresh
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACES_DETAILS_BUDGET: ${{ vars.PLACES_DETAILS_BUDGET }}

      # TRUST SCORE 精度向上: snapshots ≥2 保有店数を可視化。ここが増えないと
      # S7（時系列健全性）はいつまでも中立点固定になる（ISSUE-084 と同じ「検知できるはず」
      # を検知と数えない原則で、実行結果をログに残し Inspector が月次で確認できるようにする）。
      - name: 時系列蓄積の健全性確認
        if: always()
        run: |
          if [ ! -f data/places_history.json ]; then
            echo "::warning::data/places_history.json が無い"
            exit 0
          fi
          node -e '
            const h = require("./data/places_history.json");
            const ids = Object.keys(h);
            const multi = ids.filter(id => Array.isArray(h[id].snapshots) && h[id].snapshots.length >= 2).length;
            const withText = ids.filter(id => Array.isArray(h[id].latestReviews) && h[id].latestReviews.some(r => typeof r.textLen === "number")).length;
            console.log(`履歴保有店舗: ${ids.length}`);
            console.log(`snapshots≥2（時系列判定が効き始める店）: ${multi} (${(multi/ids.length*100).toFixed(1)}%)`);
            console.log(`textLen付きレビュー保有店: ${withText}（S8本文実在性シグナル用）`);
          '

      # ISSUE-056: 取得後の Google評価 カバレッジ見込みを可視化（50% 目標への進捗確認）。
      # 追加シークレット不要 — index.html の LOCAL_STORES と places_resolved.json だけで算出。
      - name: Google評価 カバレッジ見込み
        if: always()
        run: |
          if [ ! -f data/places_resolved.json ]; then
            echo "::warning::data/places_resolved.json が無い — GOOGLE_PLACES_API_KEY 未設定の可能性。docs/places-api-setup.md 参照"
            exit 0
          fi
          node -e '
            // ISSUE-015-P2 第二段: data/stores.json 優先・無ければ index.html フォールバック（共有ヘルパー）
            const fs = require("fs");
            const { loadStores } = require("./scripts/lib/load_stores");
            const stores = loadStores();
            const cache = JSON.parse(fs.readFileSync("data/places_resolved.json", "utf8"));
            const total = stores.length;
            const haveNow = stores.filter(s => s["Google評価"] && String(s["Google評価"]).trim() !== "").length;
            let projected = 0;
            for (const s of stores) {
              const cur = s["Google評価"] && String(s["Google評価"]).trim() !== "";
              const e = cache[s["ホットペッパーID"]];
              const fromApi = e && typeof e.rating === "number";
              if (cur || fromApi) projected++;
            }
            const pct = n => (n / total * 100).toFixed(1) + "%";
            console.log(`総店舗数: ${total}`);
            console.log(`現状の Google評価 充足: ${haveNow} (${pct(haveNow)})`);
            console.log(`build.js 反映後の見込み: ${projected} (${pct(projected)})  ← 目標 50%`);
            const cached = Object.keys(cache).length;
            const rated = Object.values(cache).filter(e => e && typeof e.rating === "number").length;
            const rejected = Object.values(cache).filter(e => e && e.rejected).length;
            console.log(`Places キャッシュ: ${cached}件（rating有 ${rated} / 住所却下 ${rejected}）`);
          '

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/places_resolved.json ]; then
            git add data/places_resolved.json
            [ -f data/places_history.json ] && git add data/places_history.json
            if git diff --cached --quiet; then
              echo "変更なし - コミットスキップ"
            else
              git commit -m "chore: auto-update Places API cache & history [skip actions]"
              git pull --rebase origin main || true
              git push || (sleep 5 && git pull --rebase origin main && git push)
            fi
          else
            echo "data/places_resolved.json が存在しない（GOOGLE_PLACES_API_KEY 未設定の可能性）"
          fi
