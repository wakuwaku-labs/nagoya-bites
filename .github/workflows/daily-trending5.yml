name: NAGOYA BITES — 日次「今日の話題店」TOP5 更新

on:
  schedule:
    # 毎日 20:30 UTC = 翌朝 5:30 JST
    # daily-journal.yml (22:00 UTC = 7:00 JST) より1時間半早く実行し、
    # journal が最新の5選を参照できるようにする
    - cron: '30 20 * * *'
  workflow_dispatch: # 手動実行（テスト・リカバリ用）

permissions:
  contents: write

# ISSUE-112: build.yml と同じグループに入ることで、両者が同時に走って
# data/cross_check_flags.json 等の本物のコンテンツ競合を起こすのを防ぐ。
# cancel-in-progress: false = 実行中は中断せず、次の1件をキューして完走を待つ。
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  daily-trending5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージインストール
        run: npm install

      - name: TOP5 をピックアップ（鮮度＋多媒体露出）
        run: node scripts/pick_daily_trending5.js run

      - name: build.js で LOCAL_STORES に焼き込み
        run: node build.js
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}

      - name: 変更をコミット & プッシュ
        run: |
          git config user.name  "NAGOYA BITES Daily"
          git config user.email "daily@nagoya-bites"
          # build.js が焼き込む data/stores.json 等を漏らすと、build.yml（push トリガーで
          # 並走しうる）が古い data/daily_trending5.json を読んだ結果で上書きし、TOP5の
          # 選定だけが index.html と data/stores.json とで食い違う（ISSUE: 2026-08-21
          # 写真ゲート導入時に発覚。ALL_STORES は data/stores.json 側で上書きされるため
          # 古い方が実際の表示に勝ってしまう）。build.yml の git add 対象と揃えておく。
          git add data/daily_trending5.json data/trending_stores.json data/manual_stores.json \
            data/trending_url_history.json data/stores.json data/cross_check_flags.json \
            data/crosscheck.json index.html sitemap.xml stores/ page-names.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "コミット対象の変更がありません。"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git commit -m "[agent] 今日の話題店TOP5: ${TODAY_JST}"
          # build.js が生成する残余ファイルを破棄してから rebase（再実行時に再生成されるため安全）
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          # ISSUE-112: concurrency グループ（build-deploy）で build.yml と直列化済みのため
          # コンテンツ競合は原理的に発生しないが、万一に備えて build.yml と同じ
          # 5 回指数バックオフリトライ ＋ data/ スナップショット競合の自動解消を入れる。
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push; then PUSHED=1; break; fi
            else
              # rebase 失敗 — data/ 配下のスナップショット競合のみ theirs（今回生成分）で解消
              UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              DATA_CONFLICTS=$(printf '%s' "$UNMERGED" | grep "^data/" || true)
              OTHER_CONFLICTS=$(printf '%s' "$UNMERGED" | grep -v "^data/" || true)
              if [ -z "$OTHER_CONFLICTS" ] && [ -n "$DATA_CONFLICTS" ]; then
                echo "data/ スナップショット競合を自動解消: $(printf '%s' "$DATA_CONFLICTS" | tr '\n' ' ')"
                printf '%s\n' "$DATA_CONFLICTS" | xargs git checkout --theirs --
                printf '%s\n' "$DATA_CONFLICTS" | xargs git add
                if GIT_EDITOR=true git rebase --continue; then
                  if git push; then PUSHED=1; break; fi
                else
                  git rebase --abort 2>/dev/null || true
                fi
              else
                git rebase --abort 2>/dev/null || true
              fi
            fi
            echo "push 失敗（試行 ${i}/5）。$((i * 5))秒待って再試行します"
            sleep $((i * 5))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::5回リトライしてもpushできませんでした。他のワークフローとの競合が解消しない可能性があります"
            exit 1
          fi

      - name: 実行ログ
        if: always()
        run: |
          echo "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST') — 日次TOP5パイプライン完了" >> agent-run.log
          git config user.name  "NAGOYA BITES Daily" 2>/dev/null || true
          git config user.email "daily@nagoya-bites" 2>/dev/null || true
          git add agent-run.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "[agent] 日次TOP5ログ更新 [skip ci]"
          git push || true
