name: Nightly QA (テスト/性能/セキュリティ)

# 毎晩 AM 6:00 JST に回る夜間QA。3本柱:
#   1. テスト実行（ユニットテスト・node:test 全件）
#   2. 性能測定（静的指標・前回比の退行検知）
#   3. セキュリティチェック（機密ファイル追跡 / シークレット混入 / npm 脆弱性）
# QA対象の「変更スコープ」はその日の差分のみ（特集/ジャーナル/build等の関連監査）。
# デプロイ（3時 JST の Build & Deploy）はブロックしない独立ジョブ。
# ハード失敗時のみ Issue を起票して朝に気づけるようにする。

on:
  schedule:
    # 06:00 JST = 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '遡る時間窓（h）'
        required: false
        default: '26'

permissions:
  contents: write   # 発見事項を agent-backlog.md に起票してコミットするため
  issues: write

concurrency:
  group: nightly-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 時間窓モードで当日コミットを見るため履歴が要る
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund --silent

      - name: Run nightly QA (window-only / 当日差分)
        id: qa
        run: |
          node scripts/nightly_qa.js --window-only --no-advance \
            --hours "${{ github.event.inputs.hours || '26' }}"

      # ── 公開後の鮮度の見張り（媒体方針 S5-5・ADR 0069）──────────────────────────────
      # 見直す日が来た記事を毎日数本だけ拾い、出典を取り直して照合する。既定は「記録だけ」:
      # 本番の記事は書き換えない。訂正案と保留は GitHub Issue（→メール）で人に届ける（警報を防音室で鳴らさない・CLAUDE.md 原則2）。
      # 軽い訂正を自動で書くのは data/trust_metrics_policy.json の recheck.mode=apply_light のときだけ（本人の再承認まで入れない）。
      # continue-on-error: 見直しの失敗で夜間QAの「FAIL」Issue を汚さない。失敗は下の専用 Issue で知らせる。
      - name: 公開後の鮮度を見直す（記録だけ）
        id: recheck
        if: always() && !cancelled()
        continue-on-error: true
        run: node scripts/recheck_due_articles.js --report "${RUNNER_TEMP}/recheck-report.json"

      - name: 見直しで見つけた変更を Issue にする（訂正案・保留）
        id: recheck_issues
        if: always() && !cancelled() && steps.recheck.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/recheck-report.json`, 'utf8'));
            const label = 'article-recheck';
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            for (const a of report.alerts) {
              const marker = `<!-- recheck-key: ${a.key} -->`;
              if (open.some(i => (i.body || '').includes(marker))) { core.info(`起票済み: ${a.key}`); continue; }
              const { data: created } = await github.rest.issues.create({ owner, repo, title: a.title, body: `${a.body}\n\n${marker}`, labels: [label] });
              core.info(`起票: #${created.number} ${a.key}`);
            }
            core.info(`見直す日が来た記事 ${report.due} 本・見直した ${report.processed.length} 本・Issue の材料 ${report.alerts.length} 件`);

      - name: 見直しの記録をコミット（Issue の起票が通ったときだけ）
        if: always() && !cancelled() && steps.recheck_issues.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article_recheck_log.json journal data/journal_published.json || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "chore(recheck): 公開後の鮮度の見直しの記録 [skip actions]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::見直しの記録を push できませんでした"
          exit 1

      - name: 見直しが動かなかったら Issue を起票/更新、動いたらクローズ
        if: always() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'article-recheck';
            const title = '🔴 公開後の鮮度の見直しが動いていません';
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            const existing = open.find(i => i.title === title);
            const failed = '${{ steps.recheck.outcome }}' === 'failure' || '${{ steps.recheck_issues.outcome }}' === 'failure';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed) {
              const body = `夜間の検査に相乗りしている公開後の鮮度の見直し（scripts/recheck_due_articles.js）が失敗しました。\n\n- 原因の候補: 見直す日が来た記事があるのに1本も見直せなかった／例外／Issue の起票の失敗\n- 実行: ${run}\n\n見直しが止まると、公開後に古くなった記事を見つけられません（見張りの見張りは scripts/check_trust_metrics_health.js の recheck_stale）。成功すると自動でクローズします。`;
              if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `再発: ${run}` });
              else await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else if (existing && '${{ steps.recheck.outcome }}' === 'success') {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `✅ 復旧を確認しました（${run}）。自動クローズします。` });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-report
          path: docs/qa/nightly-*.md
          if-no-files-found: warn
          retention-days: 30

      - name: 新しいQA課題をLinearへ同期
        if: always() && !cancelled()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/sync_qa_findings_to_linear.js

      - name: 発見事項の起票をコミット（backlogとLinear同期台帳）
        # QA がハード失敗で exit 1 でも backlog へ起票済みなら同期・記録する。
        # [skip actions] でデプロイ(build.yml)は誘発しない。
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent-backlog.md data/qa_findings.json data/linear_sync_state.json data/linear_sync_pending.json docs/qa/ || true
          git diff --cached --quiet || git commit -m "chore(qa): 夜間QA発見事項を起票 [skip actions]"
          git pull --rebase origin main || true
          git push || (sleep 5 && git pull --rebase origin main && git push) || true

      - name: ハード失敗なら Issue を起票/更新（朝の通知）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'docs/qa';
            let body = '夜間QAでハード失敗が発生しました。詳細はアーティファクト `nightly-qa-report` を確認してください。';
            try {
              const files = fs.readdirSync(dir).filter(f => f.startsWith('nightly-') && f.endsWith('.md')).sort();
              if (files.length) body = fs.readFileSync(path.join(dir, files[files.length - 1]), 'utf8');
            } catch (e) {}
            const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            const title = `🔴 夜間QA FAIL ${today}`;
            const label = 'nightly-qa';
            // 既存のオープン issue を探して更新、なければ新規作成
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const existing = issues.find(i => i.title.startsWith('🔴 夜間QA FAIL'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `再発（${today}）。最新レポートで本文を更新しました。`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

      - name: PASSなら既存のオープンIssueを復旧クローズ（ISSUE-130・オオカミ少年化防止）
        # ハード失敗ステップは if:failure() でのみ動くため、回復日（PASS）には既存Issueを
        # 誰も閉じない設計だった（Issue #83が復旧後も3日分の緑runを跨いで放置された実例）。
        # journal-watchdog.yml 等、他のwatchdogと同じ「復旧したら自動で静かにする」パターンを揃える。
        if: steps.qa.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-qa';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 20,
            });
            const existing = issues.find(i => i.title.startsWith('🔴 夜間QA FAIL'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ 復旧を確認しました（このrun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} が PASS）。自動クローズします。`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              core.info(`Issue #${existing.number} を復旧クローズしました。`);
            } else {
              core.info('オープンな夜間QA Issue はありません。');
            }
