<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9edd;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2d6fa3;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a52;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#152d42;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Rain lines -->
  <g opacity="0.25" stroke="#7ec8e3" stroke-width="1.5">
    <line x1="50" y1="0" x2="30" y2="450" />
    <line x1="120" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="180" y2="450" />
    <line x1="280" y1="0" x2="260" y2="450" />
    <line x1="350" y1="0" x2="330" y2="450" />
    <line x1="430" y1="0" x2="410" y2="450" />
    <line x1="510" y1="0" x2="490" y2="450" />
    <line x1="590" y1="0" x2="570" y2="450" />
    <line x1="670" y1="0" x2="650" y2="450" />
    <line x1="750" y1="0" x2="730" y2="450" />
    <line x1="85" y1="0" x2="65" y2="450" />
    <line x1="165" y1="0" x2="145" y2="450" />
    <line x1="245" y1="0" x2="225" y2="450" />
    <line x1="315" y1="0" x2="295" y2="450" />
    <line x1="395" y1="0" x2="375" y2="450" />
    <line x1="475" y1="0" x2="455" y2="450" />
    <line x1="555" y1="0" x2="535" y2="450" />
    <line x1="635" y1="0" x2="615" y2="450" />
    <line x1="715" y1="0" x2="695" y2="450" />
    <line x1="785" y1="0" x2="765" y2="450" />
  </g>

  <!-- Main title area -->
  <text x="400" y="75" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="28" font-weight="bold" fill="#e8f4fd" text-anchor="middle">梅雨の名古屋メシ</text>
  <text x="400" y="108" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="14" fill="#7ec8e3" text-anchor="middle">雨の日に足を運びたい「屋内集中型」5ジャンル</text>

  <!-- Divider -->
  <line x1="80" y1="124" x2="720" y2="124" stroke="#3a6b8a" stroke-width="1" />

  <!-- 5 genre cards -->
  <!-- Card 1: ラーメン・あんかけスパ -->
  <rect x="40" y="140" width="138" height="100" rx="8" fill="url(#cardGrad)" stroke="#3a7a9c" stroke-width="1" />
  <text x="109" y="168" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#f8a500" text-anchor="middle">🍜</text>
  <text x="109" y="192" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">味噌ラーメン</text>
  <text x="109" y="208" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">あんかけスパ</text>
  <text x="109" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="9" fill="#6aadcc" text-anchor="middle">名古屋固有の濃厚系</text>

  <!-- Card 2: 鉄板焼 -->
  <rect x="193" y="140" width="138" height="100" rx="8" fill="url(#cardGrad)" stroke="#3a7a9c" stroke-width="1" />
  <text x="262" y="168" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#f8a500" text-anchor="middle">🥩</text>
  <text x="262" y="192" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">鉄板焼</text>
  <text x="262" y="208" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">すき焼き</text>
  <text x="262" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="9" fill="#6aadcc" text-anchor="middle">熱さを共有する空間</text>

  <!-- Card 3: 焼鳥 -->
  <rect x="346" y="140" width="108" height="100" rx="8" fill="#1e3d58" stroke="#4a9edd" stroke-width="1.5" />
  <text x="400" y="168" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#f8a500" text-anchor="middle">🍢</text>
  <text x="400" y="192" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#e0f0ff" text-anchor="middle" font-weight="bold">カウンター</text>
  <text x="400" y="208" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#e0f0ff" text-anchor="middle" font-weight="bold">焼鳥・割烹</text>
  <text x="400" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="9" fill="#7ec8e3" text-anchor="middle">雨音と一人酒</text>

  <!-- Card 4: カフェ -->
  <rect x="469" y="140" width="138" height="100" rx="8" fill="url(#cardGrad)" stroke="#3a7a9c" stroke-width="1" />
  <text x="538" y="168" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#f8a500" text-anchor="middle">☕</text>
  <text x="538" y="192" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">韓国カフェ</text>
  <text x="538" y="208" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">甘味処</text>
  <text x="538" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="9" fill="#6aadcc" text-anchor="middle">長居できる空間</text>

  <!-- Card 5: うなぎ -->
  <rect x="622" y="140" width="138" height="100" rx="8" fill="url(#cardGrad)" stroke="#3a7a9c" stroke-width="1" />
  <text x="691" y="168" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" fill="#f8a500" text-anchor="middle">🐟</text>
  <text x="691" y="192" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">うなぎ</text>
  <text x="691" y="208" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle" font-weight="bold">ひつまぶし</text>
  <text x="691" y="230" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="9" fill="#6aadcc" text-anchor="middle">今から予約を</text>

  <!-- Bottom section: subway map hint -->
  <rect x="40" y="262" width="720" height="70" rx="8" fill="#0f2233" stroke="#2a5a7c" stroke-width="1" />
  <text x="400" y="286" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="12" fill="#7ec8e3" text-anchor="middle" font-weight="bold">📍 名古屋地下街ネットワーク ── 雨に濡れずに美食ゾーンへ</text>

  <!-- Station boxes -->
  <rect x="70" y="298" width="80" height="24" rx="4" fill="#1a3d5c" stroke="#4a9edd" stroke-width="1" />
  <text x="110" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle">名駅</text>

  <line x1="150" y1="310" x2="178" y2="310" stroke="#4a9edd" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="178" y="298" width="80" height="24" rx="4" fill="#1a3d5c" stroke="#4a9edd" stroke-width="1" />
  <text x="218" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle">丸の内</text>

  <line x1="258" y1="310" x2="286" y2="310" stroke="#4a9edd" stroke-width="1.5" />

  <rect x="286" y="298" width="80" height="24" rx="4" fill="#1a3d5c" stroke="#4a9edd" stroke-width="1" />
  <text x="326" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle">伏見</text>

  <line x1="366" y1="310" x2="394" y2="310" stroke="#4a9edd" stroke-width="1.5" />

  <rect x="394" y="298" width="80" height="24" rx="4" fill="#224d70" stroke="#6ab8e0" stroke-width="1.5" />
  <text x="434" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#e0f0ff" text-anchor="middle" font-weight="bold">栄</text>

  <line x1="474" y1="310" x2="502" y2="310" stroke="#4a9edd" stroke-width="1.5" />

  <rect x="502" y="298" width="80" height="24" rx="4" fill="#1a3d5c" stroke="#4a9edd" stroke-width="1" />
  <text x="542" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle">矢場町</text>

  <line x1="582" y1="310" x2="610" y2="310" stroke="#4a9edd" stroke-width="1.5" />

  <rect x="610" y="298" width="80" height="24" rx="4" fill="#1a3d5c" stroke="#4a9edd" stroke-width="1" />
  <text x="650" y="314" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#a8d8ea" text-anchor="middle">大須観音</text>

  <!-- Footer note -->
  <text x="400" y="365" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="10" fill="#4a8aaa" text-anchor="middle">サカエチカ・ユニモール・サンロードで地下街を繋いで移動可能</text>

  <!-- Brand badge -->
  <text x="400" y="430" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11" fill="#2d5a7a" text-anchor="middle">NAGOYA BITES  |  nagoya-bites.com</text>
</svg>
