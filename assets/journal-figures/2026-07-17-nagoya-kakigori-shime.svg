<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="夜22時まで、名古屋のかき氷は〆にも効く 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#1d5b74"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0d2a3a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#bfe6f0" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="260" fill="url(#bg)"/>
  <rect width="600" height="260" fill="url(#grain)" opacity=".5"/>

  <!-- かき氷モチーフ（器＋盛り氷） -->
  <g opacity=".5" fill="none" stroke="#bfe6f0" stroke-width="2">
    <path d="M452 176 q58 -66 116 0 z"/>
    <path d="M452 176 l14 46 q42 12 88 0 l14 -46"/>
    <line x1="510" y1="118" x2="510" y2="150"/>
  </g>
  <g fill="#bfe6f0" opacity=".35">
    <circle cx="486" cy="150" r="3"/>
    <circle cx="510" cy="140" r="3"/>
    <circle cx="534" cy="150" r="3"/>
  </g>

  <rect x="36" y="40" width="3" height="150" fill="#7fd4e8" opacity=".95"/>
  <text x="46" y="112" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="30" font-weight="700" letter-spacing="0.02em">夜22時まで、名古屋の</text><text x="46" y="150" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="30" font-weight="700" letter-spacing="0.02em">かき氷は〆にも効く</text>
  <text x="46" y="62" fill="#7fd4e8" opacity=".8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES · 2026 夏</text>
  <text x="46" y="182" fill="#bfe6f0" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="13" letter-spacing="0.05em">名駅・栄で完結する、夏の涼の立ち回り</text>
</svg>
