<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="お通しの価格帯と、店が請求しているチャージの内訳。300〜399円が40.4%、500〜599円が21.2%。お通し代38.2%、席料28.7%、サービス料15.1%。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#22384f"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0a1a2a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e8c890" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#grain)" opacity=".5"/>

  <text x="36" y="34" fill="#e8c890" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES</text>
  <rect x="36" y="46" width="3" height="26" fill="#e8c890" opacity=".9"/>
  <text x="48" y="68" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="22" font-weight="700">お通し450円は、どこに立っている金額か</text>

  <!-- 左パネル: お通しの価格帯 -->
  <text x="36" y="106" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">お通しの価格帯</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" fill="#dce6f0">
    <text x="36" y="134">300〜399円</text>
    <rect x="120" y="123" width="150" height="14" fill="#e8c890" opacity=".85"/>
    <text x="278" y="134" fill="#e8c890" font-weight="700">40.4%</text>

    <text x="36" y="166">500〜599円</text>
    <rect x="120" y="155" width="79" height="14" fill="#e8c890" opacity=".55"/>
    <text x="278" y="166" fill="#e8c890" font-weight="700">21.2%</text>
  </g>
  <!-- 450円の位置 -->
  <line x1="120" y1="180" x2="270" y2="180" stroke="#7f95ab" stroke-width="1" opacity=".5"/>
  <line x1="205" y1="112" x2="205" y2="186" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>
  <text x="205" y="200" text-anchor="middle" fill="#fff" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="11" opacity=".85">450円＝二つの山の谷間</text>

  <!-- 右パネル: 請求しているチャージ -->
  <text x="330" y="106" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">店が請求しているチャージ</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" fill="#dce6f0">
    <text x="330" y="134">お通し代</text>
    <rect x="404" y="123" width="115" height="14" fill="#8fb6d9" opacity=".9"/>
    <text x="527" y="134" fill="#8fb6d9" font-weight="700">38.2%</text>

    <text x="330" y="160">席料</text>
    <rect x="404" y="149" width="86" height="14" fill="#8fb6d9" opacity=".7"/>
    <text x="527" y="160" fill="#8fb6d9" font-weight="700">28.7%</text>

    <text x="330" y="186">サービス料</text>
    <rect x="404" y="175" width="45" height="14" fill="#8fb6d9" opacity=".5"/>
    <text x="527" y="186" fill="#8fb6d9" font-weight="700">15.1%</text>
  </g>

  <!-- 下段: 値上げ圧 -->
  <line x1="36" y1="228" x2="564" y2="228" stroke="#e8c890" stroke-width="1" opacity=".3"/>
  <text x="36" y="256" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">この金額に上からかかっている圧</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" fill="#dce6f0">
    <text x="36" y="280">飲食店の20.2%が、1年以内にお通しを値上げ済み</text>
    <text x="36" y="300">2026年8月の飲食料品値上げは2311品目、前年同月から8割増</text>
  </g>

  <text x="36" y="318" fill="#7f95ab" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="9.5">出典: シンクロ・フード調査（2023-08-30 / 有効回答373名）</text>
  <text x="36" y="331" fill="#7f95ab" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="9.5">　　　帝国データバンク 価格改定動向調査 2026年8月（2026-07-31）</text>
</svg>
