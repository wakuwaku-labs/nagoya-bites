<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1a12"/>
  <!-- Header -->
  <text x="600" y="52" font-family="Georgia, serif" font-size="18" fill="#7a9e7e" text-anchor="middle" letter-spacing="3">NAGOYA BITES — 業界の裏側</text>
  <text x="600" y="95" font-family="Georgia, serif" font-size="30" fill="#e8d5b0" text-anchor="middle" font-weight="bold">一人飲み歓迎の店を見抜く5つのサイン</text>
  <!-- Divider -->
  <line x1="100" y1="115" x2="1100" y2="115" stroke="#4a6b4e" stroke-width="1"/>
  <!-- 5 Signs as icon boxes -->
  <!-- Box 1: Counter seats -->
  <rect x="50" y="140" width="200" height="200" rx="8" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1.5"/>
  <text x="150" y="185" font-family="Georgia, serif" font-size="42" text-anchor="middle" fill="#c9956b">①</text>
  <text x="150" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">カウンター席</text>
  <text x="150" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">7席以上</text>
  <text x="150" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7a9e7e">均等サービスの証明</text>
  <!-- Checkmark 1 -->
  <circle cx="150" cy="330" r="12" fill="#2d5a30"/>
  <text x="150" y="336" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7fd4a8">✓</text>

  <!-- Box 2: Menu -->
  <rect x="270" y="140" width="200" height="200" rx="8" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1.5"/>
  <text x="370" y="185" font-family="Georgia, serif" font-size="42" text-anchor="middle" fill="#c9956b">②</text>
  <text x="370" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">グラスワイン</text>
  <text x="370" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">一合単位あり</text>
  <text x="370" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7a9e7e">少量多品目設計</text>
  <circle cx="370" cy="330" r="12" fill="#2d5a30"/>
  <text x="370" y="336" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7fd4a8">✓</text>

  <!-- Box 3: SNS -->
  <rect x="490" y="140" width="200" height="200" rx="8" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1.5"/>
  <text x="590" y="185" font-family="Georgia, serif" font-size="42" text-anchor="middle" fill="#c9956b">③</text>
  <text x="590" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">公式SNSで</text>
  <text x="590" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">「一人」タグあり</text>
  <text x="590" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7a9e7e">意識的な歓迎の証</text>
  <circle cx="590" cy="330" r="12" fill="#2d5a30"/>
  <text x="590" y="336" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7fd4a8">✓</text>

  <!-- Box 4: Phone -->
  <rect x="710" y="140" width="200" height="200" rx="8" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1.5"/>
  <text x="810" y="185" font-family="Georgia, serif" font-size="42" text-anchor="middle" fill="#c9956b">④</text>
  <text x="810" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">電話で聞いたら</text>
  <text x="810" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">即答「ぜひ」</text>
  <text x="810" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7a9e7e">体温計代わりになる</text>
  <circle cx="810" cy="330" r="12" fill="#2d5a30"/>
  <text x="810" y="336" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7fd4a8">✓</text>

  <!-- Box 5: Evening slot -->
  <rect x="930" y="140" width="220" height="200" rx="8" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1.5"/>
  <text x="1040" y="185" font-family="Georgia, serif" font-size="42" text-anchor="middle" fill="#c9956b">⑤</text>
  <text x="1040" y="230" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">17〜18時台の</text>
  <text x="1040" y="252" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#e8d5b0">予約に空きあり</text>
  <text x="1040" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#7a9e7e">ソロ客枠を意識した設計</text>
  <circle cx="1040" cy="330" r="12" fill="#2d5a30"/>
  <text x="1040" y="336" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#7fd4a8">✓</text>

  <!-- Bottom message -->
  <text x="600" y="420" font-family="Georgia, serif" font-size="22" fill="#e8d5b0" text-anchor="middle">5つ全部当てはまれば、一人で入れる確率は格段に上がる</text>
  <text x="600" y="460" font-family="sans-serif" font-size="15" fill="#7a9e7e" text-anchor="middle">業界人が日常的に使うチェックポイント / NAGOYA BITES 編集部</text>

  <!-- Insight boxes -->
  <rect x="150" y="490" width="900" height="70" rx="6" fill="#1a2e1e" stroke="#4a6b4e" stroke-width="1"/>
  <text x="600" y="522" font-family="sans-serif" font-size="14" fill="#c9956b" text-anchor="middle">INSIDER POINT</text>
  <text x="600" y="548" font-family="sans-serif" font-size="13" fill="#e8d5b0" text-anchor="middle">カウンター1席あたり70cm以上 ＋ グラスワイン3種以上 ＋「おひとり」タグ = 業界人の三位一体チェックリスト</text>

  <!-- Footer -->
  <text x="600" y="608" font-family="sans-serif" font-size="12" fill="#4a6b4e" text-anchor="middle">nagoya-bites.com — 名古屋飲食業界の中の人が運営する目利きメディア</text>
</svg>
