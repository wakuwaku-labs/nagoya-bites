<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="8月7日の立秋から8月16日のお盆明けまでの、名古屋の飲食店の時間割。8月8日から名古屋城夏まつり、8月13日から16日がお盆。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#243c52"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0a1a2a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e8c890" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="320" fill="url(#bg)"/>
  <rect width="600" height="320" fill="url(#grain)" opacity=".5"/>

  <text x="36" y="34" fill="#e8c890" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES</text>
  <rect x="36" y="46" width="3" height="26" fill="#e8c890" opacity=".9"/>
  <text x="48" y="68" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="22" font-weight="700">立秋からお盆明けまで、店の十日間</text>

  <!-- タイムライン -->
  <line x1="60" y1="150" x2="556" y2="150" stroke="#7f95ab" stroke-width="2" opacity=".6"/>

  <!-- 8/7 立秋 -->
  <circle cx="76" cy="150" r="6" fill="#e8c890"/>
  <text x="76" y="132" text-anchor="middle" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" font-weight="700">8/7</text>
  <text x="76" y="174" text-anchor="middle" fill="#fff" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12">立秋</text>
  <text x="76" y="190" text-anchor="middle" fill="#9fb3c8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="10">暦の上の秋</text>

  <!-- 8/8-8/16 夏まつり帯 -->
  <rect x="150" y="106" width="380" height="18" rx="3" fill="#8fb6d9" opacity=".28"/>
  <text x="340" y="119" text-anchor="middle" fill="#cfe0f0" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="11">8/8〜8/16　名古屋城夏まつり（大盆踊り 18:00〜20:00）</text>
  <circle cx="152" cy="150" r="5" fill="#8fb6d9"/>
  <text x="152" y="174" text-anchor="middle" fill="#fff" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12">8/8</text>
  <text x="152" y="190" text-anchor="middle" fill="#9fb3c8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="10">人出が先に動く</text>

  <!-- 8/13-16 お盆帯 -->
  <rect x="380" y="164" width="150" height="18" rx="3" fill="#e8c890" opacity=".3"/>
  <text x="455" y="177" text-anchor="middle" fill="#f0dcb8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="11">8/13〜8/16　お盆</text>
  <circle cx="382" cy="150" r="5" fill="#e8c890"/>
  <text x="382" y="200" text-anchor="middle" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" font-weight="700">8/13</text>
  <text x="382" y="216" text-anchor="middle" fill="#9fb3c8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="10">帰省の会食</text>

  <circle cx="530" cy="150" r="5" fill="#7f95ab"/>
  <text x="530" y="200" text-anchor="middle" fill="#9fb3c8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12">8/16</text>

  <!-- 気温 -->
  <line x1="36" y1="238" x2="564" y2="238" stroke="#e8c890" stroke-width="1" opacity=".3"/>
  <text x="36" y="264" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">暦は秋、気温は真夏のまま</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" fill="#dce6f0">
    <text x="36" y="286">8月2日、三重・桑名と岐阜・多治見で39.9度、愛知・豊田で39.4度</text>
  </g>
  <text x="36" y="302" fill="#7f95ab" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="9.5">出典: 中日新聞Web（2026-08-02）、日本気象協会 tenki.jp（2026-08-04）</text>
  <text x="36" y="315" fill="#7f95ab" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="9.5">　　　名古屋城公式ウェブサイト「名古屋城夏まつり（2026年）」</text>
</svg>
