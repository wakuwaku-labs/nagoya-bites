<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1a12"/>
  <!-- Header -->
  <text x="600" y="52" font-family="Georgia, serif" font-size="18" fill="#7a9e7e" text-anchor="middle" letter-spacing="3">NAGOYA BITES — 業界の裏側</text>
  <text x="600" y="95" font-family="Georgia, serif" font-size="26" fill="#e8d5b0" text-anchor="middle" font-weight="bold">時給1,500円でも人が集まらない店の共通点</text>
  <line x1="100" y1="115" x2="1100" y2="115" stroke="#4a6b4e" stroke-width="1"/>

  <!-- Left side: Problems (red) -->
  <rect x="50" y="135" width="520" height="340" rx="8" fill="#1a1010" stroke="#7a2c2c" stroke-width="1.5"/>
  <text x="310" y="168" font-family="sans-serif" font-size="16" fill="#e8a0a0" text-anchor="middle" font-weight="bold">集まらない店の5つの問題</text>
  <text x="310" y="192" font-family="sans-serif" font-size="13" fill="#7a9e7e" text-anchor="middle">時給を上げても解決しない構造的要因</text>

  <!-- Problem list -->
  <text x="80" y="225" font-family="sans-serif" font-size="15" fill="#e8d5b0">① シフトが読めない（急な繁忙対応）</text>
  <text x="80" y="255" font-family="sans-serif" font-size="15" fill="#e8d5b0">② 深夜固定シフト（24時〜2時）</text>
  <text x="80" y="285" font-family="sans-serif" font-size="15" fill="#e8d5b0">③ オーナーの感謝がない・機嫌が読めない</text>
  <text x="80" y="315" font-family="sans-serif" font-size="15" fill="#e8d5b0">④ 研修がなく放置される</text>
  <text x="80" y="345" font-family="sans-serif" font-size="15" fill="#e8d5b0">⑤ SNSに悪い口コミが先に出てくる</text>

  <!-- Wage label -->
  <rect x="155" y="370" width="310" height="70" rx="6" fill="#2a1515" stroke="#7a2c2c" stroke-width="1"/>
  <text x="310" y="400" font-family="Georgia, serif" font-size="24" fill="#e8a0a0" text-anchor="middle" font-weight="bold">時給 ¥1,500</text>
  <text x="310" y="425" font-family="sans-serif" font-size="13" fill="#7a9e7e" text-anchor="middle">名古屋相場上限付近でも応募ゼロ</text>

  <!-- Center arrow -->
  <text x="600" y="310" font-family="sans-serif" font-size="30" text-anchor="middle" fill="#4a6b4e">↔</text>
  <text x="600" y="340" font-family="sans-serif" font-size="12" fill="#4a6b4e" text-anchor="middle">対比</text>

  <!-- Right side: Solutions (green) -->
  <rect x="630" y="135" width="520" height="340" rx="8" fill="#0f1a12" stroke="#2d5a30" stroke-width="1.5"/>
  <text x="890" y="168" font-family="sans-serif" font-size="16" fill="#7fd4a8" text-anchor="middle" font-weight="bold">安定採用できている店の3条件</text>
  <text x="890" y="192" font-family="sans-serif" font-size="13" fill="#7a9e7e" text-anchor="middle">時給以外の価値で選ばれている</text>

  <!-- Solution list with checkmarks -->
  <circle cx="665" cy="230" r="10" fill="#2d5a30"/>
  <text x="665" y="236" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#7fd4a8">✓</text>
  <text x="685" y="235" font-family="sans-serif" font-size="15" fill="#e8d5b0">シフト希望が通りやすい</text>

  <circle cx="665" cy="275" r="10" fill="#2d5a30"/>
  <text x="665" y="281" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#7fd4a8">✓</text>
  <text x="685" y="280" font-family="sans-serif" font-size="15" fill="#e8d5b0">まかないが充実している</text>

  <circle cx="665" cy="320" r="10" fill="#2d5a30"/>
  <text x="665" y="326" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#7fd4a8">✓</text>
  <text x="685" y="325" font-family="sans-serif" font-size="15" fill="#e8d5b0">TikTok / IG でバイト日常発信</text>
  <text x="700" y="345" font-family="sans-serif" font-size="12" fill="#7a9e7e">→ 求人サイトの3〜5倍の応募効果（業界体感）</text>

  <!-- SNS effect -->
  <rect x="690" y="370" width="400" height="70" rx="6" fill="#1a2e1e" stroke="#2d5a30" stroke-width="1"/>
  <text x="890" y="400" font-family="sans-serif" font-size="14" fill="#7fd4a8" text-anchor="middle">SNS採用の効果（業界体感）</text>
  <text x="890" y="425" font-family="Georgia, serif" font-size="22" fill="#c9956b" text-anchor="middle">× 3〜5倍</text>

  <!-- Bottom insight -->
  <line x1="100" y1="495" x2="1100" y2="495" stroke="#4a6b4e" stroke-width="1"/>
  <text x="600" y="528" font-family="sans-serif" font-size="14" fill="#e8d5b0" text-anchor="middle">客席から見えるサイン：スタッフが笑顔で余裕を持って動いている店 = 採用・研修が機能している</text>
  <text x="600" y="552" font-family="sans-serif" font-size="13" fill="#7a9e7e" text-anchor="middle">名古屋の飲食アルバイト時給相場（2026年6月）: 1,200〜1,600円台</text>
  <text x="600" y="610" font-family="sans-serif" font-size="12" fill="#4a6b4e" text-anchor="middle">nagoya-bites.com — 名古屋飲食業界の中の人が運営する目利きメディア</text>
</svg>
