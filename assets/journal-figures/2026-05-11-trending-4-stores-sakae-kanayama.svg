<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" role="img" aria-label="GW明けに名古屋で『満点評価』が並ぶ4軒 — 栄・金山エリア週次話題店">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#3a2810"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#1a1208"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#c4a060" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="600" height="315" fill="url(#bg)"/>
  <rect width="600" height="315" fill="url(#grain)" opacity=".5"/>

  <!-- accent bar -->
  <rect x="36" y="28" width="3" height="60" fill="#c4a060" opacity=".9"/>

  <!-- header -->
  <text x="46" y="50" fill="#c4a060" opacity=".8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES / 週次話題店</text>
  <text x="46" y="80" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="26" font-weight="700" letter-spacing="0.04em">GW明けの『満点評価』4軒</text>
  <text x="46" y="108" fill="#c4a060" opacity=".7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="0.15em">栄・金山エリア / 2026-05-11</text>

  <!-- divider -->
  <line x1="36" y1="125" x2="564" y2="125" stroke="#c4a060" stroke-opacity=".25" stroke-width="1"/>

  <!-- 4 stores grid -->
  <!-- Store 1: 焼肉ホタル -->
  <rect x="36" y="140" width="250" height="68" rx="4" fill="#fff" fill-opacity=".04" stroke="#c4a060" stroke-opacity=".2" stroke-width="1"/>
  <text x="50" y="162" fill="#c4a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.2em">YAKINIKU · 栄東</text>
  <text x="50" y="182" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">焼肉ホタル 栄東店</text>
  <text x="50" y="200" fill="#c4a060" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700">★ 4.7</text>

  <!-- Store 2: 手羽先むつみ -->
  <rect x="310" y="140" width="250" height="68" rx="4" fill="#fff" fill-opacity=".04" stroke="#c4a060" stroke-opacity=".2" stroke-width="1"/>
  <text x="324" y="162" fill="#c4a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.2em">TEBASAKI · 住吉</text>
  <text x="324" y="182" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">手羽先むつみ 住吉店</text>
  <text x="324" y="200" fill="#c4a060" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700">★ 4.8</text>

  <!-- Store 3: 台所 宗や -->
  <rect x="36" y="222" width="250" height="68" rx="4" fill="#fff" fill-opacity=".04" stroke="#c4a060" stroke-opacity=".2" stroke-width="1"/>
  <text x="50" y="244" fill="#c4a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.2em">IZAKAYA · 金山</text>
  <text x="50" y="264" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">台所 宗や 金山</text>
  <text x="50" y="282" fill="#c4a060" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700">★ 4.6</text>

  <!-- Store 4: ワンタンバー -->
  <rect x="310" y="222" width="250" height="68" rx="4" fill="#fff" fill-opacity=".04" stroke="#c4a060" stroke-opacity=".2" stroke-width="1"/>
  <text x="324" y="244" fill="#c4a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.2em">WONTON · 栄</text>
  <text x="324" y="264" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">ワンタンバー</text>
  <text x="324" y="282" fill="#c4a060" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700">★ 4.9</text>
</svg>
