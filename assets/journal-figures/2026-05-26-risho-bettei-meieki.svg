    <text x="58" y="194" fill="#d4a574" font-size="22" font-weight="700">¥8,000</text>
    <text x="58" y="214" fill="#fff" font-size="10" opacity=".85">全9品・接待入口</text>
    <text x="58" y="230" fill="#fff" font-size="10" opacity=".7">実勢会計 ¥11–13K帯</text>

    <rect x="220" y="148" width="160" height="92" fill="none" stroke="#d4a574" stroke-width="1.4" opacity=".9"/>
    <text x="232" y="172" fill="#fff" font-size="14" font-weight="700">別邸コース</text>
    <text x="232" y="194" fill="#d4a574" font-size="22" font-weight="700">¥12,000</text>
    <text x="232" y="214" fill="#fff" font-size="10" opacity=".85">全11品・接待主軸</text>
    <text x="232" y="230" fill="#fff" font-size="10" opacity=".7">実勢会計 ¥16–18K帯</text>

    <rect x="394" y="148" width="160" height="92" fill="none" stroke="#d4a574" stroke-width="1.4" opacity=".9"/>
    <text x="406" y="172" fill="#fff" font-size="14" font-weight="700">プレミアム</text>
    <text x="406" y="194" fill="#d4a574" font-size="22" font-weight="700">¥15,000</text>
    <text x="406" y="214" fill="#fff" font-size="10" opacity=".85">全11品・記念日</text>
    <text x="406" y="230" fill="#fff" font-size="10" opacity=".7">実勢会計 ¥20–22K帯</text>
