<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="李昇別邸 名駅9階 — 業界人視点で読むコース構造と席の使い分け">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e0a"/>
      <stop offset="100%" stop-color="#3a1a14"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#1a0e0a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#d4a574" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="320" fill="url(#bg)"/>
  <rect width="600" height="320" fill="url(#grain)" opacity=".5"/>

  <text x="46" y="36" fill="#d4a574" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES — INDUSTRY INSIDER</text>

  <rect x="36" y="48" width="3" height="68" fill="#d4a574" opacity=".95"/>
  <text x="46" y="78" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="22" font-weight="700" letter-spacing="0.02em">名駅9階の新焼肉「李昇別邸」</text>
  <text x="46" y="108" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="20" font-weight="700" letter-spacing="0.02em">業界人視点でコースと席を読む</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#d4a574" opacity=".85" letter-spacing="0.18em">
