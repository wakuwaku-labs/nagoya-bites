  </g>

  <g font-family="'Hiragino Mincho ProN','Yu Mincho',serif">
    <rect x="46" y="276" width="100" height="28" fill="#d4a574" opacity=".15" stroke="#d4a574" stroke-width="1"/>
    <text x="96" y="294" fill="#fff" font-size="11" text-anchor="middle">個室・接待</text>

    <rect x="156" y="276" width="100" height="28" fill="#d4a574" opacity=".10" stroke="#d4a574" stroke-width="1"/>
    <text x="206" y="294" fill="#fff" font-size="11" text-anchor="middle">テーブル中軸</text>

    <rect x="266" y="276" width="100" height="28" fill="#d4a574" opacity=".05" stroke="#d4a574" stroke-width="1"/>
    <text x="316" y="294" fill="#fff" font-size="11" text-anchor="middle">窓側・夜景</text>

    <text x="380" y="294" fill="#d4a574" font-size="11" opacity=".7">徒歩1分 / 名駅太閤通口</text>
