<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" role="img" aria-label="鶏ん家 新栄 — Google 4.8評価を支える地鶏専門の価格・オペ・シーン設計">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#1a2a38"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0d1520"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#6ab4e0" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="600" height="315" fill="url(#bg)"/>
  <rect width="600" height="315" fill="url(#grain)" opacity=".5"/>

  <!-- accent bar -->
  <rect x="36" y="28" width="3" height="60" fill="#6ab4e0" opacity=".9"/>

  <!-- header -->
  <text x="46" y="50" fill="#6ab4e0" opacity=".8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES / 今日の1軒</text>
  <text x="46" y="80" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="24" font-weight="700" letter-spacing="0.04em">鶏ん家 — 4.8評価の構造</text>
  <text x="46" y="108" fill="#6ab4e0" opacity=".7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="0.15em">新栄 名古屋新栄店 / Google ★4.8</text>

  <!-- divider -->
  <line x1="36" y1="125" x2="564" y2="125" stroke="#6ab4e0" stroke-opacity=".25" stroke-width="1"/>

  <!-- key facts -->
  <text x="36" y="152" fill="#6ab4e0" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em">評価を支える3つの要素</text>

  <!-- Fact 1: Brand chicken -->
  <rect x="36" y="164" width="160" height="70" rx="4" fill="#fff" fill-opacity=".04" stroke="#6ab4e0" stroke-opacity=".3" stroke-width="1"/>
  <text x="50" y="184" fill="#6ab4e0" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">看板素材</text>
  <text x="50" y="206" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">華味鳥</text>
  <text x="50" y="224" fill="#6ab4e0" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">ブランド地鶏・専門店品質</text>

  <!-- Fact 2: Price design -->
  <rect x="216" y="164" width="160" height="70" rx="4" fill="#fff" fill-opacity=".04" stroke="#6ab4e0" stroke-opacity=".3" stroke-width="1"/>
  <text x="230" y="184" fill="#6ab4e0" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">価格帯</text>
  <text x="230" y="206" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">¥3,000〜4,000</text>
  <text x="230" y="224" fill="#6ab4e0" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">夜・飲み放題込みの実態</text>

  <!-- Fact 3: Scene -->
  <rect x="396" y="164" width="164" height="70" rx="4" fill="#fff" fill-opacity=".04" stroke="#6ab4e0" stroke-opacity=".3" stroke-width="1"/>
  <text x="410" y="184" fill="#6ab4e0" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">シーン適性</text>
  <text x="410" y="206" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">宴会・接待</text>
  <text x="410" y="224" fill="#6ab4e0" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">個室あり・まとまった人数</text>

  <!-- insight -->
  <rect x="36" y="252" width="524" height="48" rx="4" fill="#fff" fill-opacity=".06" stroke="#6ab4e0" stroke-opacity=".35" stroke-width="1"/>
  <text x="50" y="271" fill="#6ab4e0" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em">業界人の視点</text>
  <text x="50" y="288" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="13" font-weight="600">「地鶏専門」の絞り込みが全評価軸を底上げする</text>
</svg>
