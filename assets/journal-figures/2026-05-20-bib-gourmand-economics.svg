<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="ビブグルマン価格帯の名古屋店はなぜこの値段でやれるのか——席数×回転×原価の三角形">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#231405"/>
      <stop offset="100%" stop-color="#5a3a12"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#231405"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e0b252" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#grain)" opacity=".5"/>

  <g opacity=".35" fill="none" stroke="#e0b252" stroke-width="2">
    <rect x="470" y="296" width="100" height="48"/>
    <line x1="470" y1="312" x2="570" y2="312"/>
  </g>
  <text x="520" y="330" text-anchor="middle" fill="#e0b252" opacity=".6"
        font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" font-weight="700">NB</text>

  <rect x="36" y="30" width="3" height="64" fill="#e0b252" opacity=".9"/>
  <text x="48" y="58" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="26" font-weight="700">5,000円以下でやれる理由</text>
  <text x="48" y="86" fill="#f0d9a8" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15">ビブグルマン価格帯を支える「席数 × 回転 × 原価」の三角形</text>

  <!-- triangle -->
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
    <polygon points="300,130 200,290 400,290" fill="none" stroke="#e0b252" stroke-width="1.6" opacity=".85"/>
    <circle cx="300" cy="130" r="5" fill="#e0b252"/>
    <text x="300" y="120" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">席数を絞る</text>
    <text x="300" y="108" text-anchor="middle" fill="#f0d9a8" font-size="11">目が届く・ロスが減る</text>
    <circle cx="200" cy="290" r="5" fill="#e0b252"/>
    <text x="170" y="312" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">回転を上げる</text>
    <text x="170" y="328" text-anchor="middle" fill="#f0d9a8" font-size="11">短時間で満席を回す</text>
    <circle cx="400" cy="290" r="5" fill="#e0b252"/>
    <text x="432" y="312" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">原価を集中</text>
    <text x="432" y="328" text-anchor="middle" fill="#f0d9a8" font-size="11">看板1品に張る</text>
    <text x="300" y="222" text-anchor="middle" fill="#e0b252" font-size="13" font-weight="700">この3点が噛み合うと</text>
    <text x="300" y="244" text-anchor="middle" fill="#fff" font-size="14">安くても利益が残る</text>
  </g>

  <text x="48" y="346" fill="#e0b252" opacity=".75" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="12">例：十割そば800円・立ち食い寿司・ひつまぶしの名店——安さは妥協ではなく設計</text>
</svg>
