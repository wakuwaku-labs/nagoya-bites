    <circle cx="200" cy="200" r="4" fill="#c4a060" opacity=".5"/>
    <text x="200" y="222" fill="#e8d9b8" font-size="11" text-anchor="middle">17:00</text>
    <text x="200" y="238" fill="#e8d9b8" font-size="11" text-anchor="middle">ハッピーアワー</text>

    <circle cx="330" cy="200" r="4" fill="#c4a060"/>
    <text x="330" y="222" fill="#e8d9b8" font-size="11" text-anchor="middle">19:00</text>
    <text x="330" y="238" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">¥900</text>
