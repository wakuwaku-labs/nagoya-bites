<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="名古屋の夜営業——時間帯と必要な届出・許可の関係を示す図解。午前0時を境に深夜酒類提供飲食店営業の届出が必要になり、接待を伴う場合は風俗営業の許可が別に要る。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#1d2c45"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0e1726"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#7fb0e0" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#grain)" opacity=".5"/>

  <!-- NB mark -->
  <rect x="36" y="30" width="3" height="60" fill="#e0b252" opacity=".9"/>
  <text x="48" y="56" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="25" font-weight="700">名古屋の夜、その営業の「届出と実態」</text>
  <text x="48" y="82" fill="#cfe0f2" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="14">時間帯ごとに必要になる届出・許可——栄／錦／女子大小路で起きていること</text>

  <!-- time axis -->
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
    <line x1="60" y1="150" x2="560" y2="150" stroke="#7fb0e0" stroke-width="1.4" opacity=".7"/>
    <!-- ticks: 18 / 22 / 24(0) / 1 / 6 -->
    <g fill="#cfe0f2" font-size="12" text-anchor="middle">
      <line x1="60"  y1="144" x2="60"  y2="156" stroke="#7fb0e0" stroke-width="1.2"/>
      <text x="60"  y="138">18時</text>
      <line x1="210" y1="144" x2="210" y2="156" stroke="#7fb0e0" stroke-width="1.2"/>
      <text x="210" y="138">22時</text>
      <line x1="300" y1="140" x2="300" y2="160" stroke="#e0b252" stroke-width="2"/>
      <text x="300" y="134" fill="#e0b252" font-weight="700">午前0時（深夜の境）</text>
      <line x1="360" y1="144" x2="360" y2="156" stroke="#7fb0e0" stroke-width="1.2"/>
      <text x="360" y="138">1時</text>
      <line x1="560" y1="144" x2="560" y2="156" stroke="#7fb0e0" stroke-width="1.2"/>
      <text x="560" y="138">6時</text>
    </g>

    <!-- band 1: ordinary food service (before 0:00) -->
    <rect x="60" y="166" width="240" height="44" rx="4" fill="#244a32" stroke="#5bbf7a" stroke-width="1.2" opacity=".9"/>
    <text x="180" y="186" text-anchor="middle" fill="#dff5e6" font-size="13" font-weight="700">通常の飲食店営業</text>
    <text x="180" y="202" text-anchor="middle" fill="#bfe8cd" font-size="11">食品衛生の営業許可で営業可</text>

    <!-- band 2: late-night alcohol service (after 0:00) -->
    <rect x="300" y="166" width="260" height="44" rx="4" fill="#3a2a12" stroke="#e0b252" stroke-width="1.4"/>
    <text x="430" y="186" text-anchor="middle" fill="#fbeccb" font-size="13" font-weight="700">深夜酒類提供飲食店営業</text>
    <text x="430" y="202" text-anchor="middle" fill="#f0d9a8" font-size="11">＝0時以降も酒を主に出すなら「届出」が要る</text>

    <!-- requirement callouts -->
    <g font-size="12">
      <rect x="60" y="232" width="500" height="58" rx="6" fill="#15233a" stroke="#3a5274" stroke-width="1"/>
      <text x="78" y="254" fill="#7fb0e0" font-size="12" font-weight="700">必要な届出</text>
      <text x="78" y="274" fill="#e7eef7" font-size="12">深夜における酒類提供飲食店営業営業開始届出書 → 所轄警察署 生活安全課へ、開始10日前まで</text>
      <text x="78" y="290" fill="#9fb6d2" font-size="11">※「深夜」は午前0時〜午前6時。届出に接待は含まれない（接待をするなら別枠）</text>
    </g>

    <!-- contrast: entertainment business needs a license, can't run deep-night -->
    <g font-size="12">
      <rect x="60" y="300" width="245" height="62" rx="6" fill="#1a2336" stroke="#3a5274" stroke-width="1"/>
      <text x="78" y="322" fill="#e0b252" font-size="12" font-weight="700">接待を伴うなら</text>
      <text x="78" y="340" fill="#e7eef7" font-size="11">風俗営業（接待飲食店）の「許可」が別に必要。</text>
      <text x="78" y="356" fill="#9fb6d2" font-size="11">届出だけで接待は不可。営業時間にも制限。</text>

      <rect x="315" y="300" width="245" height="62" rx="6" fill="#1a2336" stroke="#3a5274" stroke-width="1"/>
      <text x="333" y="322" fill="#e0b252" font-size="12" font-weight="700">場所のルール</text>
      <text x="333" y="340" fill="#e7eef7" font-size="11">住居系の用途地域（第一種地域）では深夜営業不可。</text>
      <text x="333" y="356" fill="#9fb6d2" font-size="11">繁華街は1時まで等の特例区域がある。</text>
    </g>
  </g>

  <text x="60" y="386" fill="#7fb0e0" opacity=".8" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="11">図: NAGOYA BITES 編集部（記事固有のイメージ図）／一般的な制度の関係を示す概念図・個別店の判断は所轄に確認を</text>
</svg>
