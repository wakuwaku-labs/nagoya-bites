<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1a12"/>
  <!-- Header -->
  <text x="600" y="52" font-family="Georgia, serif" font-size="18" fill="#7a9e7e" text-anchor="middle" letter-spacing="3">NAGOYA BITES — 業界の裏側</text>
  <text x="600" y="95" font-family="Georgia, serif" font-size="26" fill="#e8d5b0" text-anchor="middle" font-weight="bold">個室 vs 一枚板カウンター —— 名古屋の接待席の定石</text>
  <line x1="100" y1="115" x2="1100" y2="115" stroke="#4a6b4e" stroke-width="1"/>

  <!-- Private Room -->
  <rect x="50" y="140" width="490" height="300" rx="8" fill="#1a1a2e" stroke="#5a5a9e" stroke-width="2"/>
  <text x="295" y="175" font-family="Georgia, serif" font-size="22" fill="#a0a0e8" text-anchor="middle" font-weight="bold">個室</text>
  <text x="295" y="200" font-family="sans-serif" font-size="14" fill="#7a9e7e" text-anchor="middle">「隠す・密談・演出」の機能</text>

  <!-- Room illustration - enclosed box -->
  <rect x="120" y="215" width="350" height="130" rx="4" fill="#12122a" stroke="#4a4a7e" stroke-width="1.5"/>
  <!-- Table inside -->
  <rect x="195" y="255" width="200" height="50" rx="3" fill="#2a2a4e" stroke="#5a5a9e" stroke-width="1"/>
  <!-- Chairs -->
  <rect x="175" y="260" width="20" height="40" rx="2" fill="#3a3a6e"/>
  <rect x="395" y="260" width="20" height="40" rx="2" fill="#3a3a6e"/>
  <!-- Door indicator -->
  <line x1="120" y1="310" x2="120" y2="345" stroke="#4a4a7e" stroke-width="2"/>
  <path d="M120 345 Q155 345 155 310" fill="none" stroke="#7a7aae" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Private room use cases -->
  <text x="160" y="375" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ 初対面の商談・契約前の食事</text>
  <text x="160" y="398" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ 機密情報を伴う場</text>
  <text x="160" y="421" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ プレゼント演出・記念日</text>

  <!-- VS divider -->
  <text x="600" y="305" font-family="Georgia, serif" font-size="28" fill="#c9956b" text-anchor="middle" font-weight="bold">vs</text>
  <text x="600" y="335" font-family="sans-serif" font-size="12" fill="#4a6b4e" text-anchor="middle">目的で選ぶ</text>

  <!-- Counter -->
  <rect x="660" y="140" width="490" height="300" rx="8" fill="#1a2e1a" stroke="#2d5a30" stroke-width="2"/>
  <text x="905" y="175" font-family="Georgia, serif" font-size="22" fill="#7fd4a8" text-anchor="middle" font-weight="bold">一枚板カウンター</text>
  <text x="905" y="200" font-family="sans-serif" font-size="14" fill="#7a9e7e" text-anchor="middle">「見せる・共有・感性」の機能</text>

  <!-- Counter illustration - open space -->
  <rect x="720" y="215" width="350" height="130" rx="4" fill="#0f1a0f" stroke="#2d5a30" stroke-width="1.5"/>
  <!-- Long counter bar -->
  <rect x="740" y="295" width="310" height="20" rx="2" fill="#3a5a3a" stroke="#4a8a4a" stroke-width="1"/>
  <!-- Bar stools -->
  <rect x="755" y="270" width="20" height="25" rx="2" fill="#2d5a30"/>
  <rect x="800" y="270" width="20" height="25" rx="2" fill="#2d5a30"/>
  <rect x="845" y="270" width="20" height="25" rx="2" fill="#2d5a30"/>
  <rect x="890" y="270" width="20" height="25" rx="2" fill="#2d5a30"/>
  <rect x="935" y="270" width="20" height="25" rx="2" fill="#2d5a30"/>
  <!-- Chef side -->
  <rect x="740" y="217" width="310" height="55" rx="2" fill="#1a3a1a"/>
  <text x="895" y="250" font-family="sans-serif" font-size="12" fill="#7fd4a8" text-anchor="middle">シェフの調理が目の前で展開</text>

  <!-- Counter use cases -->
  <text x="720" y="375" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ 料理体験を共有したい接待</text>
  <text x="720" y="398" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ クリエイティブ・IT系クライアント</text>
  <text x="720" y="421" font-family="sans-serif" font-size="13" fill="#e8d5b0">✦ 感性・目利きを示す場</text>

  <!-- Bottom: Hybrid recommendation -->
  <rect x="100" y="458" width="1000" height="80" rx="6" fill="#1a2218" stroke="#c9956b" stroke-width="1"/>
  <text x="600" y="487" font-family="sans-serif" font-size="14" fill="#c9956b" text-anchor="middle">★ 業界人の推奨：「カウンター＋個室1〜2室」ハイブリッド型（栄・錦エリア）</text>
  <text x="600" y="512" font-family="sans-serif" font-size="13" fill="#e8d5b0" text-anchor="middle">接待本番は個室で → 食後はカウンターで2次会シームレス。一軒完結できる構造が接待ベテランに支持される。</text>

  <text x="600" y="610" font-family="sans-serif" font-size="12" fill="#4a6b4e" text-anchor="middle">nagoya-bites.com — 名古屋飲食業界の中の人が運営する目利きメディア</text>
</svg>
