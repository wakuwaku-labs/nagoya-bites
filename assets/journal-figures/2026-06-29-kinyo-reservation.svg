<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1208"/>
  <!-- Top accent -->
  <rect y="0" width="1200" height="5" fill="#c9956b"/>

  <!-- Eyebrow -->
  <text x="90" y="70" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif" font-size="15" fill="#c9956b" letter-spacing="3">NAGOYA BITES — 業界の裏側</text>

  <!-- Main title -->
  <text x="90" y="138" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif" font-size="40" fill="#f5f0ea" font-weight="bold">金曜19時の予約が取れない理由</text>
  <text x="90" y="185" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif" font-size="24" fill="#c9956b">— 2部制と「15分ずらし」の仕組み</text>

  <!-- Divider -->
  <line x1="90" y1="210" x2="1110" y2="210" stroke="#333" stroke-width="1"/>

  <!-- Timeline rail -->
  <line x1="90" y1="370" x2="1110" y2="370" stroke="#444" stroke-width="2"/>

  <!-- 1部 block: 19:00 → 21:00 (x=250 to x=730) -->
  <rect x="250" y="295" width="480" height="70" fill="#7a2c2c" rx="5" opacity="0.92"/>
  <text x="490" y="337" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="17" fill="#f5c0b0" text-anchor="middle" font-weight="bold">1 部　19:00 〜 21:00（最速で埋まる）</text>

  <!-- 2部 block: 21:00 → 23:00 (x=730 to x=1050) -->
  <rect x="730" y="295" width="320" height="70" fill="#1d4a36" rx="5" opacity="0.92"/>
  <text x="890" y="337" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="17" fill="#7fd4a8" text-anchor="middle" font-weight="bold">2 部　21:00 〜（空きあり）</text>

  <!-- Time tick marks and labels -->
  <!-- 18:30 -->
  <line x1="90" y1="362" x2="90" y2="378" stroke="#555" stroke-width="2"/>
  <text x="90" y="400" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">18:30</text>

  <!-- 19:00 -->
  <line x1="250" y1="355" x2="250" y2="385" stroke="#c9956b" stroke-width="2"/>
  <text x="250" y="405" font-family="sans-serif" font-size="16" fill="#c9956b" text-anchor="middle" font-weight="bold">19:00</text>

  <!-- 19:15 穴場 -->
  <line x1="370" y1="355" x2="370" y2="385" stroke="#7fd4a8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="370" y="275" font-family="sans-serif" font-size="13" fill="#7fd4a8" text-anchor="middle">19:15</text>
  <text x="370" y="258" font-family="sans-serif" font-size="11" fill="#7fd4a8" text-anchor="middle">穴場 ★</text>
  <line x1="370" y1="265" x2="370" y2="293" stroke="#7fd4a8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 20:00 穴場 -->
  <line x1="570" y1="355" x2="570" y2="385" stroke="#7fd4a8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="570" y="275" font-family="sans-serif" font-size="13" fill="#7fd4a8" text-anchor="middle">20:00</text>
  <text x="570" y="258" font-family="sans-serif" font-size="11" fill="#7fd4a8" text-anchor="middle">穴場 ★</text>
  <line x1="570" y1="265" x2="570" y2="293" stroke="#7fd4a8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 21:00 -->
  <line x1="730" y1="355" x2="730" y2="385" stroke="#c9956b" stroke-width="2"/>
  <text x="730" y="405" font-family="sans-serif" font-size="16" fill="#c9956b" text-anchor="middle" font-weight="bold">21:00</text>

  <!-- 23:00 -->
  <line x1="1050" y1="362" x2="1050" y2="378" stroke="#555" stroke-width="2"/>
  <text x="1050" y="400" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">23:00</text>

  <!-- Annotation box: なぜ穴場？ -->
  <rect x="90" y="430" width="480" height="80" fill="#252010" rx="4" stroke="#3a3020" stroke-width="1"/>
  <text x="110" y="458" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#c9956b">なぜ「15分ずらし」で入れるのか？</text>
  <text x="110" y="478" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#aaa">ネット予約サイトは「整時」枠（19:00・20:00・21:00）で設定されており、</text>
  <text x="110" y="496" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#aaa">中間の 19:15 や 19:30 は電話予約で融通が利く枠として残りやすい。</text>

  <!-- Annotation box: 電話黄金時間 -->
  <rect x="620" y="430" width="490" height="80" fill="#252010" rx="4" stroke="#3a3020" stroke-width="1"/>
  <text x="640" y="458" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="13" fill="#c9956b">電話が繋がりやすい時間帯</text>
  <text x="640" y="478" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#aaa">▶ 11:00 〜 11:30 ——仕込み一段落のタイミング</text>
  <text x="640" y="496" font-family="'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="12" fill="#aaa">▶ 17:00 〜 17:30 ——開店準備を終えた時間帯</text>

  <!-- Footer -->
  <text x="600" y="600" font-family="sans-serif" font-size="11" fill="#444" text-anchor="middle">NAGOYA BITES 編集部 © 2026 — nagoya-bites.com</text>
</svg>
