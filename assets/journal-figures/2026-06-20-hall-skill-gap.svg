<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="ホールスタッフのレベル差が最も出る店のタイプを、同時並行業務の多さで示した図解。接待コース×ドリンクペアリングの店は同時進行する判断が多くレベル差が大きく出る。カジュアル単品中心の店は差が出にくい。人手不足が前提化した2026年、ホールの力量が体験を左右する。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1414"/>
      <stop offset="1" stop-color="#261a18"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e0a878" font-family="Georgia,serif" font-size="21" font-weight="bold">ホールの力量差が「出やすい店」</text>
  <text x="40" y="72" fill="#a08c7c" font-family="sans-serif" font-size="13">同時並行する判断が多い業態ほど、差がはっきり出る</text>

  <!-- axis -->
  <line x1="80" y1="330" x2="540" y2="330" stroke="#5a4438" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="110" stroke="#5a4438" stroke-width="2"/>
  <text x="300" y="360" fill="#a08c7c" font-family="sans-serif" font-size="11" text-anchor="middle">同時並行業務の多さ →</text>
  <text x="40" y="220" fill="#a08c7c" font-family="sans-serif" font-size="11" transform="rotate(-90 40 220)" text-anchor="middle">レベル差の出やすさ →</text>

  <!-- plotted dots -->
  <g font-family="sans-serif" font-size="11">
    <circle cx="150" cy="300" r="9" fill="#6b8f5a"/>
    <text x="150" y="288" fill="#e8ddd0" text-anchor="middle">大衆居酒屋</text>
    <text x="150" y="318" fill="#8f7a68" font-size="9" text-anchor="middle">単品・回転</text>

    <circle cx="280" cy="230" r="9" fill="#b8923a"/>
    <text x="280" y="218" fill="#e8ddd0" text-anchor="middle">ビストロ</text>

    <circle cx="400" cy="165" r="10" fill="#c2643f"/>
    <text x="400" y="153" fill="#e8ddd0" text-anchor="middle">接待コース店</text>
    <text x="400" y="183" fill="#8f7a68" font-size="9" text-anchor="middle">ペアリング・間合い</text>

    <circle cx="480" cy="135" r="10" fill="#c2643f"/>
    <text x="480" y="123" fill="#e8ddd0" text-anchor="middle">割烹カウンター</text>
  </g>

  <text x="40" y="384" fill="#7c6a5a" font-family="sans-serif" font-size="10">図: NAGOYA BITES 編集部 — 人手不足が前提化した今、ホールの読みは接待・会食ほど効く</text>
</svg>
