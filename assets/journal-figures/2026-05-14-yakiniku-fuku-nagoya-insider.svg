<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" role="img" aria-label="焼肉 福 — 一人焼肉から60名宴会まで成立させる価格設計">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0808"/>
      <stop offset="100%" stop-color="#3a1410"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#1c0808"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e04040" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="600" height="315" fill="url(#bg)"/>
  <rect width="600" height="315" fill="url(#grain)" opacity=".5"/>

  <!-- accent bar -->
  <rect x="36" y="28" width="3" height="60" fill="#e8a060" opacity=".9"/>

  <!-- header -->
  <text x="46" y="50" fill="#e8a060" opacity=".8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES / 今日の1軒</text>
  <text x="46" y="80" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="24" font-weight="700" letter-spacing="0.04em">焼肉 福 — 価格設計の解剖</text>
  <text x="46" y="108" fill="#e8a060" opacity=".7" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="0.15em">名駅西口 徒歩3分 / Google ★4.6</text>

  <!-- divider -->
  <line x1="36" y1="125" x2="564" y2="125" stroke="#e8a060" stroke-opacity=".25" stroke-width="1"/>

  <!-- 3-axis diagram -->
  <!-- Axis labels -->
  <text x="36" y="155" fill="#e8a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em">シーン適性の3軸</text>

  <!-- Axis 1: Price -->
  <rect x="36" y="168" width="155" height="55" rx="4" fill="#fff" fill-opacity=".04" stroke="#e8a060" stroke-opacity=".3" stroke-width="1"/>
  <text x="50" y="188" fill="#e8a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">PRICE</text>
  <text x="50" y="208" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="14" font-weight="700">¥4,500〜 コース</text>
  <text x="50" y="218" fill="#e8a060" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">黒毛和牛・飲み放題込み</text>

  <!-- Axis 2: Seating -->
  <rect x="210" y="168" width="155" height="55" rx="4" fill="#fff" fill-opacity=".04" stroke="#e8a060" stroke-opacity=".3" stroke-width="1"/>
  <text x="224" y="188" fill="#e8a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">SEATING</text>
  <text x="224" y="208" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="14" font-weight="700">1名〜60名</text>
  <text x="224" y="218" fill="#e8a060" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">カウンター〜大宴会</text>

  <!-- Axis 3: Scene -->
  <rect x="384" y="168" width="176" height="55" rx="4" fill="#fff" fill-opacity=".04" stroke="#e8a060" stroke-opacity=".3" stroke-width="1"/>
  <text x="398" y="188" fill="#e8a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="0.15em">SCENE</text>
  <text x="398" y="208" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="14" font-weight="700">一人焼肉 / 接待 / 宴会</text>
  <text x="398" y="218" fill="#e8a060" opacity=".7" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="10">ねとらぼ 名駅ランチ 1位</text>

  <!-- key insight -->
  <rect x="36" y="240" width="524" height="56" rx="4" fill="#fff" fill-opacity=".06" stroke="#e8a060" stroke-opacity=".35" stroke-width="1"/>
  <text x="50" y="260" fill="#e8a060" opacity=".6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="0.2em">業界人の視点</text>
  <text x="50" y="280" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="13" font-weight="600">「4,500円コース」が一人焼肉と60名宴会を同一ハコで成立させる設計</text>
</svg>
