<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="辛麺 華火 新栄町本店 カウンター8席・深夜3時までの営業設計図">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0c08"/>
      <stop offset="100%" stop-color="#5a1e10"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#2a0c08"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e08a4a" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="260" fill="url(#bg)"/>
  <rect width="600" height="260" fill="url(#grain)" opacity=".5"/>

  <g opacity=".4" fill="none" stroke="#e08a4a" stroke-width="2">
    <rect x="430" y="160" width="160" height="90"/>
    <line x1="430" y1="178" x2="590" y2="178"/>
    <line x1="430" y1="232" x2="590" y2="232"/>
  </g>
  <text x="510" y="220" text-anchor="middle" fill="#e08a4a" opacity=".6"
        font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif"
        font-size="42" font-weight="700">NB</text>

  <rect x="36" y="36" width="3" height="145" fill="#e08a4a" opacity=".9"/>
  <text x="46" y="90" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="28" font-weight="700" letter-spacing="0.02em">深夜3時まで8席</text>
  <text x="46" y="126" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="28" font-weight="700" letter-spacing="0.02em">辛麺 華火の設計</text>
  <text x="46" y="60" fill="#e08a4a" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <line x1="46" y1="200" x2="380" y2="200" stroke="#e08a4a" stroke-width="1.5" opacity=".55"/>
    <circle cx="60" cy="200" r="4" fill="#e08a4a"/>
    <text x="60" y="222" fill="#f2d3b8" font-size="11" text-anchor="middle">18:00</text>
    <text x="60" y="238" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">開店</text>

    <circle cx="200" cy="200" r="4" fill="#e08a4a" opacity=".5"/>
    <text x="200" y="222" fill="#f2d3b8" font-size="11" text-anchor="middle">22:00</text>
    <text x="200" y="238" fill="#f2d3b8" font-size="11" text-anchor="middle">飲み帰り客</text>

    <circle cx="330" cy="200" r="4" fill="#e08a4a"/>
    <text x="330" y="222" fill="#f2d3b8" font-size="11" text-anchor="middle">翌3:00</text>
    <text x="330" y="238" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">閉店</text>
  </g>

  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="end">
    <text x="590" y="140" fill="#f2d3b8" font-size="12" opacity=".85">カウンター8席のみ</text>
    <text x="590" y="118" fill="#f2d3b8" font-size="12" opacity=".85">価格帯 ¥900〜¥1,500</text>
  </g>
</svg>
