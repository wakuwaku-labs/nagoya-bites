<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="この夏、名古屋・大須で動いた外食の3手を業界人の目で読む図解">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2a"/>
      <stop offset="100%" stop-color="#2a4a6a"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0a1a2a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e8c890" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#bg)"/>
  <rect width="600" height="380" fill="url(#grain)" opacity=".5"/>

  <text x="40" y="46" fill="#e8c890" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES / WEEKLY DIGEST</text>
  <rect x="40" y="60" width="3" height="70" fill="#e8c890" opacity=".9"/>
  <text x="52" y="90" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="27" font-weight="700" letter-spacing="0.02em">大須で中華とバーガーが動いた週</text>
  <text x="52" y="122" fill="#e8c890" opacity=".85" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15" font-weight="700">2026年8月第1週 — 業界人が読む名古屋外食の3手</text>

  <!-- card 1 -->
  <rect x="40" y="150" width="520" height="60" rx="6" fill="#ffffff" opacity="0.05"/>
  <rect x="40" y="150" width="3" height="60" fill="#e8c890"/>
  <text x="58" y="176" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="16" font-weight="700">① ドムドムハンバーガー 大須万松寺通店</text>
  <text x="58" y="198" fill="#cfe0f0" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12">7/28開店・約200人の大行列／スガキヤ資本参加という再編の産物</text>

  <!-- card 2 -->
  <rect x="40" y="220" width="520" height="60" rx="6" fill="#ffffff" opacity="0.05"/>
  <rect x="40" y="220" width="3" height="60" fill="#e8c890"/>
  <text x="58" y="246" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="16" font-weight="700">② Mă（マー）by KIWAMI</text>
  <text x="58" y="268" fill="#cfe0f0" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12">8/1開業・築95年の建物を再生／サウナ併設の中華、滞在で単価を作る</text>

  <!-- card 3 -->
  <rect x="40" y="290" width="520" height="60" rx="6" fill="#ffffff" opacity="0.05"/>
  <rect x="40" y="290" width="3" height="60" fill="#e8c890"/>
  <text x="58" y="316" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="16" font-weight="700">③ 大判鰻 うな拓 池下店</text>
  <text x="58" y="338" fill="#cfe0f0" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12">うなぎ高騰下で「大判・低価格」／原価と回転のバランス設計を読む</text>
</svg>
