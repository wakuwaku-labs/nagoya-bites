<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Kaku Gothic ProN','ヒラギノ角ゴ ProN W3','Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <rect width="700" height="400" fill="#1a1a1a"/>
