<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="シェフが厨房に立つ店と立たない店、味は変わるのか——再現性とブレの構造図">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1f1a"/>
      <stop offset="100%" stop-color="#1d4d3f"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0c1f1a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#8fd9b6" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <rect width="600" height="360" fill="url(#grain)" opacity=".5"/>

  <g opacity=".35" fill="none" stroke="#8fd9b6" stroke-width="2">
    <rect x="470" y="296" width="100" height="48"/>
    <line x1="470" y1="312" x2="570" y2="312"/>
  </g>
  <text x="520" y="330" text-anchor="middle" fill="#8fd9b6" opacity=".6"
        font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="24" font-weight="700">NB</text>

  <rect x="36" y="30" width="3" height="64" fill="#8fd9b6" opacity=".9"/>
  <text x="48" y="58" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="26" font-weight="700">シェフは厨房に立つべきか</text>
  <text x="48" y="86" fill="#c7ecd9" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="15">「立つ店」と「立たない店」で変わるのは“味”より“再現性”</text>

  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
    <rect x="40" y="118" width="258" height="160" rx="6" fill="#10362c" stroke="#8fd9b6" stroke-width="1.2"/>
    <text x="56" y="144" fill="#8fd9b6" font-size="15" font-weight="700">オーナーシェフが立つ店</text>
    <text x="56" y="170" fill="#eafaf2" font-size="12.5">▶ 温度・湿度で日々味を微調整</text>
    <text x="56" y="192" fill="#eafaf2" font-size="12.5">▶ 客の反応が即メニューに返る</text>
    <text x="56" y="214" fill="#eafaf2" font-size="12.5">▶ 看板の再現性が高い</text>
    <text x="56" y="240" fill="#9fc6bb" font-size="11.5">弱点：休み・体調で味が止まる</text>
    <text x="56" y="262" fill="#9fc6bb" font-size="11.5">＝属人的、規模を広げにくい</text>

    <rect x="304" y="118" width="256" height="160" rx="6" fill="#102a33" stroke="#7fb6d6" stroke-width="1.2"/>
    <text x="320" y="144" fill="#7fb6d6" font-size="15" font-weight="700">立たない店（任せる店）</text>
    <text x="320" y="170" fill="#e7f2f7" font-size="12.5">▶ レシピと教育で味を標準化</text>
    <text x="320" y="192" fill="#e7f2f7" font-size="12.5">▶ 多店舗・安定供給に強い</text>
    <text x="320" y="214" fill="#e7f2f7" font-size="12.5">▶ 誰が作っても同じに寄せる</text>
    <text x="320" y="240" fill="#9fbecb" font-size="11.5">弱点：突き抜けた一皿は出にくい</text>
    <text x="320" y="262" fill="#9fbecb" font-size="11.5">＝仕組み次第で質が決まる</text>
  </g>

  <text x="48" y="344" fill="#8fd9b6" opacity=".75" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="12">見極めは「誰が作っても同じか」より「誰の哲学で回っているか」</text>
</svg>
