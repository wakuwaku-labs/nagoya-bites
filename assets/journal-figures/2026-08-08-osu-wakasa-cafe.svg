<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="WAKASA Cafe 名古屋大須店の営業設計とメニュー価格。10時から19時、約20席、フレンチトースト1500円、焼きカレー1400円、かき氷1500円、スコーンプレート1200円、スムージー900円。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#3a2258"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#1a1030"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#e8c890" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#grain)" opacity=".5"/>

  <text x="36" y="34" fill="#e8c890" opacity=".75" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.3em">NAGOYA BITES</text>
  <rect x="36" y="46" width="3" height="26" fill="#e8c890" opacity=".9"/>
  <text x="48" y="68" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="22" font-weight="700">大須に開いた、昼だけの専門店</text>

  <!-- 営業設計 -->
  <text x="36" y="106" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">店の設計</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" fill="#e2dcf0">
    <text x="36" y="130">営業　10:00 〜 19:00（L.O. 18:30）</text>
    <text x="36" y="152">定休　なし</text>
    <text x="36" y="174">席数　約20席</text>
    <text x="36" y="196">開店　2026年8月8日（京都に続く2店舗目）</text>
  </g>

  <!-- 昼帯だけを取るバー -->
  <text x="36" y="228" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="12" font-weight="700">一日のうち、店が開いている帯</text>
  <rect x="36" y="240" width="310" height="14" rx="3" fill="#2a1c46"/>
  <rect x="165" y="240" width="116" height="14" rx="3" fill="#b79bdd"/>
  <g fill="#9b8fb8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="10" text-anchor="middle">
    <text x="38" y="270">0時</text>
    <text x="165" y="270">10時</text>
    <text x="281" y="270">19時</text>
    <text x="344" y="270">24時</text>
  </g>
  <text x="36" y="292" fill="#e2dcf0" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="11">夜をやらない＝商店街の歩行者がいる時間だけに絞った設計</text>

  <!-- メニュー価格 -->
  <line x1="366" y1="96" x2="366" y2="292" stroke="#e8c890" stroke-width="1" opacity=".25"/>
  <text x="384" y="106" fill="#e8c890" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="13" font-weight="700">単品の価格</text>
  <g font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="11.5" fill="#e2dcf0">
    <text x="384" y="130">フレンチトースト</text><text x="568" y="130" text-anchor="end" fill="#b79bdd" font-weight="700">1,500円</text>
    <text x="384" y="152">かき氷（8月限定）</text><text x="568" y="152" text-anchor="end" fill="#b79bdd" font-weight="700">1,500円</text>
    <text x="384" y="174">ブルーベリーボウル</text><text x="568" y="174" text-anchor="end" fill="#b79bdd" font-weight="700">1,500円</text>
    <text x="384" y="196">焼きカレー</text><text x="568" y="196" text-anchor="end" fill="#b79bdd" font-weight="700">1,400円</text>
    <text x="384" y="218">スコーンプレート</text><text x="568" y="218" text-anchor="end" fill="#b79bdd" font-weight="700">1,200円</text>
    <text x="384" y="240">スムージー</text><text x="568" y="240" text-anchor="end" fill="#b79bdd" font-weight="700">900円</text>
  </g>
  <text x="384" y="270" fill="#9b8fb8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="10.5">食事1品を置いて滞在時間を作る構成</text>

  <text x="36" y="320" fill="#9b8fb8" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" font-size="9.5">出典: PR TIMES／株式会社わかさ生活（2026-08-07）、名古屋情報通（2026-08-08）</text>
</svg>
