<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="口コミ信頼度の読み方 — A〜Dの段階と助言語">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14301a"/>
      <stop offset="100%" stop-color="#2e5a34"/>
    </linearGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#14301a"/>
      <circle cx="0.5" cy="0.5" r="0.4" fill="#c4dcc4" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="600" height="260" fill="url(#bg)"/>
  <rect width="600" height="260" fill="url(#grain)" opacity=".5"/>
  <rect x="36" y="36" width="3" height="78" fill="#c4a060" opacity=".9"/>
  <text x="46" y="60" fill="#c4a060" opacity=".8" font-family="'DM Mono','Menlo',monospace" font-size="11" letter-spacing="0.22em">REVIEW TRUST / HOW TO READ</text>
  <text x="46" y="100" fill="#fff" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="30" font-weight="700" letter-spacing="0.02em">口コミ信頼度の読み方</text>
  <text x="46" y="126" fill="#d8e6d8" opacity=".85" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="12">「この店のGoogle★と件数は、そのまま信じてよいか」に答える段階</text>
  <g font-family="'DM Mono','Menlo',monospace" font-weight="700" text-anchor="middle">
    <rect x="46" y="152" width="118" height="70" rx="4" fill="#2e7d32" opacity=".95"/>
    <text x="105" y="190" fill="#fff" font-size="34">A</text>
    <rect x="176" y="152" width="118" height="70" rx="4" fill="#46752a" opacity=".95"/>
    <text x="235" y="190" fill="#fff" font-size="34">B</text>
    <rect x="306" y="152" width="118" height="70" rx="4" fill="#5f6b63" opacity=".95"/>
    <text x="365" y="190" fill="#fff" font-size="34">C</text>
    <rect x="436" y="152" width="118" height="70" rx="4" fill="#767676" opacity=".95"/>
    <text x="495" y="190" fill="#fff" font-size="34">D</text>
  </g>
  <g font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="10.5" fill="#e8f0e8" text-anchor="middle">
    <text x="105" y="240">そのまま参考に</text>
    <text x="235" y="240">おおむね参考に</text>
    <text x="365" y="240">参考程度に</text>
